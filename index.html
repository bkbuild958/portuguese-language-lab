":"Futuro do pretérito · chamar · você","before":"Você","after":"a Ana.","answers":["teria chamado"],"reveal":"teria chamado","speak":"Você teria chamado a Ana.","explain":"Você teria chamado. Eu and você share teria."},{"id":"cj-cc-chamar-nos","kind":"fill","model":true,"tag":"Regular","prompt":"Futuro do pretérito · chamar · nós","before":"Nós","after":"um táxi.","answers":["teríamos chamado"],"reveal":"teríamos chamado","speak":"Nós teríamos chamado um táxi.","explain":"Nós teríamos chamado. Accent on the i. A gente teria chamado."},{"id":"cj-cc-chamar-eles","kind":"fill","model":true,"tag":"Regular","prompt":"Futuro do pretérito · chamar · eles","before":"Eles","after":"mais gente.","answers":["teriam chamado"],"reveal":"teriam chamado","speak":"Eles teriam chamado mais gente.","explain":"Eles teriam chamado. No accent on teriam."},{"id":"cj-cc-atender-eu","kind":"fill","model":true,"tag":"Regular","prompt":"Futuro do pretérito · atender · eu","before":"Eu","after":"o telefone.","answers":["teria atendido"],"reveal":"teria atendido","speak":"Eu teria atendido o telefone.","explain":"Atender: teria atendido. Regular -er participle, -ido."},{"id":"cj-cc-atender-voce","kind":"fill","model":true,"tag":"Regular","prompt":"Futuro do pretérito · atender · você","before":"Você","after":"a porta.","answers":["teria atendido"],"reveal":"teria atendido","speak":"Você teria atendido a porta.","explain":"Você teria atendido."},{"id":"cj-cc-atender-nos","kind":"fill","model":true,"tag":"Regular","prompt":"Futuro do pretérito · atender · nós","before":"Nós","after":"cedo.","answers":["teríamos atendido"],"reveal":"teríamos atendido","speak":"Nós teríamos atendido cedo.","explain":"Nós teríamos atendido."},{"id":"cj-cc-atender-eles","kind":"fill","model":true,"tag":"Regular","prompt":"Futuro do pretérito · atender · eles","before":"Eles","after":"o cliente.","answers":["teriam atendido"],"reveal":"teriam atendido","speak":"Eles teriam atendido o cliente.","explain":"Eles teriam atendido."},{"id":"cj-cc-discutir-eu","kind":"fill","model":true,"tag":"Regular","prompt":"Futuro do pretérito · discutir · eu","before":"Eu","after":"o plano.","answers":["teria discutido"],"reveal":"teria discutido","speak":"Eu teria discutido o plano.","explain":"Discutir: teria discutido. Here it means would have discussed."},{"id":"cj-cc-discutir-voce","kind":"fill","model":true,"tag":"Regular","prompt":"Futuro do pretérito · discutir · você","before":"Você","after":"isso.","answers":["teria discutido"],"reveal":"teria discutido","speak":"Você teria discutido isso.","explain":"Você teria discutido."},{"id":"cj-cc-discutir-nos","kind":"fill","model":true,"tag":"Regular","prompt":"Futuro do pretérito · discutir · nós","before":"Nós","after":"antes.","answers":["teríamos discutido"],"reveal":"teríamos discutido","speak":"Nós teríamos discutido antes.","explain":"Nós teríamos discutido."},{"id":"cj-cc-discutir-eles","kind":"fill","model":true,"tag":"Regular","prompt":"Futuro do pretérito · discutir · eles","before":"Eles","after":"o filme.","answers":["teriam discutido"],"reveal":"teriam discutido","speak":"Eles teriam discutido o filme.","explain":"Eles teriam discutido."}]},{"id":"cj-part-reg","track":"verbs","group":"Composto","subgroup":"Particípio","kicker":"Particípio","title":"Regular","blurb":"Drop the infinitive ending. -ar becomes -ado. -er and -ir become -ido.","note":"The past participle is one form, then ter carries the person and the tense. Falar loses -ar and gains -ado: falado. Beber loses -er and gains -ido: bebido. Partir loses -ir and gains -ido: partido. After ter the participle does not take a plural or a feminine ending: tenho falado, temos falado, not falados.","rows":[{"left":"falar","right":"falado"},{"left":"beber","right":"bebido"},{"left":"partir","right":"partido"}],"items":[{"id":"cj-pp-caminhar","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · caminhar · eu","before":"Eu tenho","after":"bastante.","answers":["caminhado"],"reveal":"caminhado","speak":"Eu tenho caminhado bastante.","explain":"Caminhar is -ar. Drop -ar and add -ado: caminhado."},{"id":"cj-pp-escutar","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · escutar · você","before":"Você tem","after":"música.","answers":["escutado"],"reveal":"escutado","speak":"Você tem escutado música.","explain":"Escutar is -ar: escutado. Você tem, with no accent."},{"id":"cj-pp-viajar","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · viajar · nós","before":"Nós temos","after":"pouco.","answers":["viajado"],"reveal":"viajado","speak":"Nós temos viajado pouco.","explain":"Viajar is -ar: viajado."},{"id":"cj-pp-preparar","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · preparar · eles","before":"Eles têm","after":"o jantar.","answers":["preparado"],"reveal":"preparado","speak":"Eles têm preparado o jantar.","explain":"Preparar is -ar: preparado. Eles têm keeps the circumflex."},{"id":"cj-pp-lavar","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · lavar · eu","before":"Eu tinha","after":"a roupa.","answers":["lavado"],"reveal":"lavado","speak":"Eu tinha lavado a roupa.","explain":"Lavar is -ar: lavado. Tinha is the imperfect of ter."},{"id":"cj-pp-olhar","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · olhar · você","before":"Você tinha","after":"o mapa.","answers":["olhado"],"reveal":"olhado","speak":"Você tinha olhado o mapa.","explain":"Olhar is -ar: olhado. Eu and você both use tinha."},{"id":"cj-pp-esperar","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · esperar · nós","before":"Nós tínhamos","after":"uma hora.","answers":["esperado"],"reveal":"esperado","speak":"Nós tínhamos esperado uma hora.","explain":"Esperar is -ar: esperado. Nós takes tínhamos."},{"id":"cj-pp-entrar","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · entrar · eles","before":"Eles tinham","after":"cedo.","answers":["entrado"],"reveal":"entrado","speak":"Eles tinham entrado cedo.","explain":"Entrar is -ar: entrado. Eles tinham, with no accent."},{"id":"cj-pp-passar","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · passar · eu","before":"Eu terei","after":"na sua casa.","answers":["passado"],"reveal":"passado","speak":"Eu terei passado na sua casa.","explain":"Passar is -ar: passado. Terei is ter in the simple future."},{"id":"cj-pp-ajudar","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · ajudar · você","before":"Você terá","after":"a Ana.","answers":["ajudado"],"reveal":"ajudado","speak":"Você terá ajudado a Ana.","explain":"Ajudar is -ar: ajudado."},{"id":"cj-pp-explicar","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · explicar · nós","before":"Nós teremos","after":"a lição.","answers":["explicado"],"reveal":"explicado","speak":"Nós teremos explicado a lição.","explain":"Explicar is -ar: explicado."},{"id":"cj-pp-voltar","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · voltar · eles","before":"Eles terão","after":"à noite.","answers":["voltado"],"reveal":"voltado","speak":"Eles terão voltado à noite.","explain":"Voltar is -ar: voltado."},{"id":"cj-pp-jantar","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · jantar · eu","before":"Eu teria","after":"em casa.","answers":["jantado"],"reveal":"jantado","speak":"Eu teria jantado em casa.","explain":"Jantar is -ar: jantado. Teria is the conditional of ter."},{"id":"cj-pp-tomar","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · tomar · você","before":"Você teria","after":"café.","answers":["tomado"],"reveal":"tomado","speak":"Você teria tomado café.","explain":"Tomar is -ar: tomado."},{"id":"cj-pp-convidar","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · convidar · nós","before":"Nós teríamos","after":"todo mundo.","answers":["convidado"],"reveal":"convidado","speak":"Nós teríamos convidado todo mundo.","explain":"Convidar is -ar: convidado. Nós is teríamos, with an accent."},{"id":"cj-pp-mostrar","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · mostrar · eles","before":"Eles teriam","after":"o caminho.","answers":["mostrado"],"reveal":"mostrado","speak":"Eles teriam mostrado o caminho.","explain":"Mostrar is -ar: mostrado. Eles teriam has no accent."},{"id":"cj-pp-vender","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · vender · eu","before":"Eu tenho","after":"pão.","answers":["vendido"],"reveal":"vendido","speak":"Eu tenho vendido pão.","explain":"Vender is -er. Drop -er and add -ido: vendido."},{"id":"cj-pp-aprender","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · aprender · você","before":"Você tem","after":"rápido.","answers":["aprendido"],"reveal":"aprendido","speak":"Você tem aprendido rápido.","explain":"Aprender is -er: aprendido."},{"id":"cj-pp-partir","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · partir · nós","before":"Nós tínhamos","after":"cedo.","answers":["partido"],"reveal":"partido","speak":"Nós tínhamos partido cedo.","explain":"Partir is -ir. Drop -ir and add -ido: partido."},{"id":"cj-pp-subir","kind":"fill","model":true,"tag":"Regular","prompt":"Particípio · subir · eles","before":"Eles tinham","after":"a escada.","answers":["subido"],"reveal":"subido","speak":"Eles tinham subido a escada.","explain":"Subir is -ir: subido."}]},{"id":"cj-part-irr","track":"verbs","group":"Composto","subgroup":"Particípio","kicker":"Particípio","title":"Irregular","blurb":"These participles stay short even after ter. There is no -ado or -ido to build.","note":"Learn the short form as a pair with the verb. Abrir is aberto, not abrido. After ter it still does not change for gender or number: tenho aberto, tínhamos visto. Some other verbs have a short form only after ser or estar (está pago, está morto). After ter, those usually keep -ado or -ido. They are not in this drill.","rows":[{"left":"abrir","right":"aberto"},{"left":"cobrir","right":"coberto"},{"left":"dizer","right":"dito"},{"left":"escrever","right":"escrito"},{"left":"fazer","right":"feito"},{"left":"pôr","right":"posto"},{"left":"ver","right":"visto"},{"left":"vir","right":"vindo"},{"left":"descobrir","right":"descoberto"},{"left":"descrever","right":"descrito"},{"left":"desfazer","right":"desfeito"},{"left":"satisfazer","right":"satisfeito"},{"left":"compor","right":"composto"},{"left":"propor","right":"proposto"},{"left":"prever","right":"previsto"},{"left":"supor","right":"suposto"},{"left":"dispor","right":"disposto"},{"left":"repor","right":"reposto"}],"items":[{"id":"cj-pi-abrir","kind":"fill","model":true,"tag":"Irregular","prompt":"Particípio · abrir · eu","before":"Eu tenho","after":"a janela.","answers":["aberto"],"reveal":"aberto","speak":"Eu tenho aberto a janela.","explain":"Abrir → aberto. Not abrido."},{"id":"cj-pi-cobrir","kind":"fill","model":true,"tag":"Irregular","prompt":"Particípio · cobrir · você","before":"Você tem","after":"a mesa.","answers":["coberto"],"reveal":"coberto","speak":"Você tem coberto a mesa.","explain":"Cobrir → coberto."},{"id":"cj-pi-dizer","kind":"fill","model":true,"tag":"Irregular","prompt":"Particípio · dizer · nós","before":"Nós temos","after":"a verdade.","answers":["dito"],"reveal":"dito","speak":"Nós temos dito a verdade.","explain":"Dizer → dito."},{"id":"cj-pi-escrever","kind":"fill","model":true,"tag":"Irregular","prompt":"Particípio · escrever · eles","before":"Eles têm","after":"cartas.","answers":["escrito"],"reveal":"escrito","speak":"Eles têm escrito cartas.","explain":"Escrever → escrito."},{"id":"cj-pi-fazer","kind":"fill","model":true,"tag":"Irregular","prompt":"Particípio · fazer · eu","before":"Eu tinha","after":"o almoço.","answers":["feito"],"reveal":"feito","speak":"Eu tinha feito o almoço.","explain":"Fazer → feito."},{"id":"cj-pi-por","kind":"fill","model":true,"tag":"Irregular","prompt":"Particípio · pôr · você","before":"Você tinha","after":"a mesa.","answers":["posto"],"reveal":"posto","speak":"Você tinha posto a mesa.","explain":"Pôr → posto. Pôr a mesa means to set the table."},{"id":"cj-pi-ver","kind":"fill","model":true,"tag":"Irregular","prompt":"Particípio · ver · nós","before":"Nós tínhamos","after":"esse filme.","answers":["visto"],"reveal":"visto","speak":"Nós tínhamos visto esse filme.","explain":"Ver → visto."},{"id":"cj-pi-vir","kind":"fill","model":true,"tag":"Irregular","prompt":"Particípio · vir · eles","before":"Eles tinham","after":"de carro.","answers":["vindo"],"reveal":"vindo","speak":"Eles tinham vindo de carro.","explain":"Vir → vindo."},{"id":"cj-pi-descobrir","kind":"fill","model":true,"tag":"Irregular","prompt":"Particípio · descobrir · eu","before":"Eu terei","after":"o erro.","answers":["descoberto"],"reveal":"descoberto","speak":"Eu terei descoberto o erro.","explain":"Descobrir follows cobrir: descoberto."},{"id":"cj-pi-descrever","kind":"fill","model":true,"tag":"Irregular","prompt":"Particípio · descrever · você","before":"Você terá","after":"a cena.","answers":["descrito"],"reveal":"descrito","speak":"Você terá descrito a cena.","explain":"Descrever follows escrever: descrito."},{"id":"cj-pi-desfazer","kind":"fill","model":true,"tag":"Irregular","prompt":"Particípio · desfazer · nós","before":"Nós teremos","after":"a mala.","answers":["desfeito"],"reveal":"desfeito","speak":"Nós teremos desfeito a mala.","explain":"Desfazer follows fazer: desfeito."},{"id":"cj-pi-satisfazer","kind":"fill","model":true,"tag":"Irregular","prompt":"Particípio · satisfazer · eles","before":"Eles terão","after":"o cliente.","answers":["satisfeito"],"reveal":"satisfeito","speak":"Eles terão satisfeito o cliente.","explain":"Satisfazer follows fazer: satisfeito."},{"id":"cj-pi-compor","kind":"fill","model":true,"tag":"Irregular","prompt":"Particípio · compor · eu","before":"Eu teria","after":"uma música.","answers":["composto"],"reveal":"composto","speak":"Eu teria composto uma música.","explain":"Compor follows pôr: composto."},{"id":"cj-pi-propor","kind":"fill","model":true,"tag":"Irregular","prompt":"Particípio · propor · você","before":"Você teria","after":"outra ideia.","answers":["proposto"],"reveal":"proposto","speak":"Você teria proposto outra ideia.","explain":"Propor follows pôr: proposto."},{"id":"cj-pi-prever","kind":"fill","model":true,"tag":"Irregular","prompt":"Particípio · prever · nós","before":"Nós teríamos","after":"a chuva.","answers":["previsto"],"reveal":"previsto","speak":"Nós teríamos previsto a chuva.","explain":"Prever follows ver: previsto."},{"id":"cj-pi-supor","kind":"fill","model":true,"tag":"Irregular","prompt":"Particípio · supor · eu","before":"Eu tinha","after":"isso.","answers":["suposto"],"reveal":"suposto","speak":"Eu tinha suposto isso.","explain":"Supor follows pôr: suposto."},{"id":"cj-pi-dispor","kind":"fill","model":true,"tag":"Irregular","prompt":"Particípio · dispor · você","before":"Você tinha","after":"os livros.","answers":["disposto"],"reveal":"disposto","speak":"Você tinha disposto os livros.","explain":"Dispor follows pôr: disposto."},{"id":"cj-pi-repor","kind":"fill","model":true,"tag":"Irregular","prompt":"Particípio · repor · eles","before":"Eles têm","after":"o estoque.","answers":["reposto"],"reveal":"reposto","speak":"Eles têm reposto o estoque.","explain":"Repor follows pôr: reposto."}]},{"id":"oi","kicker":"Aula 1","title":"Oi, tudo bem?","blurb":"Greetings you will actually hear.","note":"Você is the default you. Bom dia lasts through the morning, boa tarde through the afternoon, and boa noite covers evening and good night.","items":[{"id":"oi-1","kind":"choice","prompt":"How do you say good morning?","choices":["Boa dia.","Bom dia.","Bom noite.","Boa manhã."],"answer":1,"speak":"Bom dia.","explain":"Dia is masculine, so it is bom dia. Boa tarde is the afternoon. Boa noite is the evening, and also how you say good night."},{"id":"oi-2","kind":"choice","prompt":"Someone says “Tudo bem?” Which reply is natural?","line":"Tudo bem?","speak":"Tudo bem?","choices":["Tudo bem, e você?","Eu sou bem.","Estou ser bem.","Muito dia."],"answer":0,"explain":"Tudo bem? and Tudo bom? are both the question and the answer. Mirror it, then send it back with e você?"},{"id":"oi-3","kind":"fill","prompt":"Nice to meet you. Fill in the missing word.","before":"","after":"prazer.","answers":["Muito","muito"],"reveal":"Muito","speak":"Muito prazer.","explain":"Muito prazer. The other person may answer O prazer é meu. Prazer em conhecer is a bit longer and just as fine."},{"id":"oi-4","kind":"choice","prompt":"What are they asking?","line":"De onde você é?","speak":"De onde você é?","choices":["Where are you going?","How old are you?","Where are you from?","Where do you live?"],"answer":2,"explain":"Origin uses ser plus de. Eu sou de Austin. Eu sou do Texas — Texas takes the masculine article, so de plus o becomes do."},{"id":"oi-5","kind":"build","prompt":"Build the question: What is your name?","tiles":["Como","você","se","chama","Qual","teu","nome"],"answer":["Como","você","se","chama"],"speak":"Como você se chama?","explain":"Como você se chama? is the everyday question. Qual é o seu nome? is also correct and a little more neutral."},{"id":"oi-6","kind":"pairs","prompt":"Match the greeting to the time of day.","pairs":[{"pt":"Bom dia","en":"Good morning"},{"pt":"Boa tarde","en":"Good afternoon"},{"pt":"Boa noite","en":"Good evening"},{"pt":"Até logo","en":"See you later"}],"explain":"Até logo is neutral. Tchau works almost everywhere. Até mais is friendly. Falou is the casual goodbye."},{"id":"oi-7","kind":"choice","tag":"Informal","prompt":"A friend says this while leaving. What does it mean?","line":"Falou, até.","speak":"Falou, até.","choices":["Excuse me.","Nice to meet you.","Bye.","You are welcome."],"answer":2,"explain":"Falou is a clipped goodbye among friends, from falou, tchau. Com licença is excuse me. De nada is you are welcome."}]},{"id":"ser","kicker":"Aula 2","title":"Ser e estar","blurb":"Identity in one verb, the moment in the other.","note":"Ser is who or what something is. Estar is how or where it is right now. A gente means we, and its verb stays singular.","items":[{"id":"ser-1","kind":"choice","prompt":"She is tired today. Which sentence is right?","choices":["Ela sou cansada.","Ela é cansada.","Ela está cansada.","Ela estar cansada."],"answer":2,"speak":"Ela está cansada.","explain":"Estar is for states that change: tired, busy, sick, ready. Ser would claim that being tired is who she is. Cansada agrees with ela."},{"id":"ser-2","kind":"fill","prompt":"She is a doctor. Professions use ser, usually with no article.","before":"Ela","after":"médica.","answers":["é"],"reveal":"é","speak":"Ela é médica.","explain":"Ela é médica. Brazilian Portuguese normally drops the article with professions. Ela é uma médica is possible, but it is not the default."},{"id":"ser-3","kind":"fill","prompt":"The coffee is hot right now.","before":"O café","after":"quente.","answers":["está"],"reveal":"está","speak":"O café está quente.","explain":"Temperature in the moment is estar. O café é bom uses ser, because that is a quality of the coffee, not a passing state. Esta, without the accent, is a different word."},{"id":"ser-4","kind":"fill","prompt":"Say we are hungry. Portuguese does not use an adjective for this.","before":"A gente está","after":".","answers":["com fome"],"reveal":"com fome","speak":"A gente está com fome.","explain":"Estar com fome, estar com sede, estar com sono, estar com pressa. Literally, to be with hunger, thirst, sleep, or a hurry."},{"id":"ser-5","kind":"choice","prompt":"What does this mean?","line":"A gente está em casa.","speak":"A gente está em casa.","choices":["People are a house.","She is the house.","We are at home.","We are from home."],"answer":2,"explain":"A gente is the everyday Brazilian we. The verb stays third person singular: a gente está, a gente vai, a gente comeu. Nós estamos is correct and more formal."},{"id":"ser-6","kind":"build","prompt":"Build “I am American,” said by a woman.","tiles":["Eu","sou","americana","estou","americano","de"],"answer":["Eu","sou","americana"],"speak":"Eu sou americana.","explain":"Nationality uses ser and agrees in gender: americano, americana. In Brazil, americano usually means from the United States. Location would be estar: Eu estou no Texas."},{"id":"ser-7","kind":"pairs","prompt":"Match the verb to the kind of fact.","pairs":[{"pt":"Eu sou","en":"I am (identity)"},{"pt":"Eu estou","en":"I am (right now)"},{"pt":"com fome","en":"hungry"},{"pt":"médica","en":"doctor (woman)"}],"explain":"Same split as the drills: ser for who, estar for the moment. Hungry is a phrase, estar com fome, not an adjective."}]},{"id":"artigos","kicker":"Aula 3","title":"O, a, um, uma","blurb":"Gender, including the words that break the pattern.","note":"Most nouns ending in -a are feminine and most ending in -o are masculine. The traps are worth more than the rule.","items":[{"id":"art-1","kind":"choice","prompt":"How do you say the table?","choices":["o mesa","um mesa","a mesa","as mesa"],"answer":2,"speak":"a mesa","explain":"Mesa is feminine. The definite article is a. One table is uma mesa."},{"id":"art-2","kind":"choice","prompt":"How do you say the problem?","choices":["a problema","o problema","uma problema","as problema"],"answer":1,"speak":"o problema","explain":"Words from Greek ending in -ma are masculine: o problema, o sistema, o programa, o mapa, o idioma. The final -a is a trap."},{"id":"art-3","kind":"choice","prompt":"How do you say the hand?","choices":["o mão","um mão","os mão","a mão"],"answer":3,"speak":"a mão","explain":"Mão is feminine: a mão, as mãos. Most words ending in -ão are masculine, like o pão and o avião. This one is not."},{"id":"art-4","kind":"fill","prompt":"A pretty house. The adjective has to agree.","before":"uma casa","after":"","answers":["bonita"],"reveal":"bonita","speak":"uma casa bonita","explain":"Casa is feminine, so bonita. A handsome car is um carro bonito. Adjectives usually follow the noun."},{"id":"art-5","kind":"fill","prompt":"The Brazilian books. Masculine plural.","before":"","after":"livros brasileiros.","answers":["Os","os"],"reveal":"Os","speak":"Os livros brasileiros.","explain":"Plural articles: os livros, as casas. The adjective goes plural too: brasileiros, brasileiras."},{"id":"art-6","kind":"pairs","prompt":"Match the article phrase. Watch the traps.","pairs":[{"pt":"o livro","en":"the book"},{"pt":"a mesa","en":"the table"},{"pt":"o problema","en":"the problem"},{"pt":"a mão","en":"the hand"}],"explain":"Livro and problema are masculine. Mesa and mão are feminine. Problema and mão are the ones learners miss."}]},{"id":"boteco","kicker":"Aula 4","title":"No boteco","blurb":"Order like a person, not a phrasebook.","note":"Quero is enough politeness. Por favor softens it. The diminutive, a continha, softens it more.","items":[{"id":"bot-1","kind":"choice","prompt":"How do you ask for the check?","choices":["O conta, por favor.","A cheque, por favor.","A conta, por favor.","Me dá a conta agora."],"answer":2,"speak":"A conta, por favor.","explain":"Conta is feminine: a conta. In a casual bar, A continha, por favor is softer. The last option is grammatical and rude."},{"id":"bot-2","kind":"fill","prompt":"Order a cheese bread.","before":"Um pão de","after":", por favor.","answers":["queijo"],"reveal":"queijo","speak":"Um pão de queijo, por favor.","explain":"Pão is masculine: o pão, um pão. Queijo is cheese. Pão de queijo is its own food, not sliced bread with cheese."},{"id":"bot-3","kind":"choice","prompt":"No sugar.","choices":["não açúcar","sem açúcar","zero açúcarado","açúcar não tem"],"answer":1,"speak":"sem açúcar","explain":"Sem plus a noun means without. Com leite is with milk. Um café sem açúcar, com leite."},{"id":"bot-4","kind":"build","prompt":"Build: I want a coffee.","tiles":["Eu","quero","um","café","uma","a","quer"],"answer":["Eu","quero","um","café"],"speak":"Eu quero um café.","explain":"Café is masculine: um café, o café. Querer is the normal way to order. Me vê um café is even more boteco."},{"id":"bot-5","kind":"fill","prompt":"Ask for still water, not sparkling.","before":"Uma água","after":".","answers":["sem gás","sem gas"],"reveal":"sem gás","speak":"Uma água sem gás.","explain":"Água is feminine: uma água, a água. Com gás is sparkling. Sem gás is still. The accent on gás matters in writing; sem gas is accepted here."},{"id":"bot-6","kind":"choice","prompt":"You are a woman saying thank you. Which form agrees with you?","choices":["Obrigado.","Obrigada.","Obrigade.","Obrigadao."],"answer":1,"speak":"Obrigada.","explain":"Thanks agrees with the speaker, not the server. A woman says obrigada. A man says obrigado. Valeu is the informal thanks, with no gender."},{"id":"bot-7","kind":"choice","tag":"Informal","prompt":"Which reply means the plan is settled?","choices":["Aberto.","Cadê?","De nada.","Fechado."],"answer":3,"speak":"Fechado.","explain":"Fechado, literally closed, means deal. Beleza, tá bom, and pode ser also accept a suggestion. De nada means you are welcome."}]},{"id":"presente","kicker":"Aula 5","title":"No presente","blurb":"The three endings, plus the Brazilian we.","note":"Você uses the same present ending as ele and ela. A gente does too. Nós is the form you will see in writing.","items":[{"id":"pre-1","kind":"choice","prompt":"I speak.","choices":["Eu fala.","Eu falar.","Eu falas.","Eu falo."],"answer":3,"speak":"Eu falo.","explain":"Falar: eu falo, você fala, a gente fala, eles falam. The -ar family is the biggest one. Você does not take the tu ending."},{"id":"pre-2","kind":"fill","prompt":"You eat beans every day. The subject is você.","before":"Você","after":"feijão todo dia.","answers":["come"],"reveal":"come","speak":"Você come feijão todo dia.","explain":"Comer: eu como, você come, eles comem. Feijão, black beans, is daily food and masculine: o feijão."},{"id":"pre-3","kind":"fill","prompt":"They live in São Paulo.","before":"Eles","after":"em São Paulo.","answers":["moram"],"reveal":"moram","speak":"Eles moram em São Paulo.","explain":"Morar: eles moram. Vocês and elas use that same ending. Cities usually take em with no article: em São Paulo, em Austin."},{"id":"pre-4","kind":"build","prompt":"Build: I do not drink coffee.","tiles":["Eu","não","bebo","café","bebe","gosto"],"answer":["Eu","não","bebo","café"],"speak":"Eu não bebo café.","explain":"Não sits directly in front of the verb. Beber: eu bebo, você bebe, eles bebem. There is no extra word for do."},{"id":"pre-5","kind":"choice","prompt":"Which is the natural spoken way to say we work?","choices":["A gente trabalho.","A gente trabalhamos.","A gente trabalha.","Nós trabalha."],"answer":2,"speak":"A gente trabalha.","explain":"A gente plus the singular: trabalha, not trabalhamos. Nós trabalhamos is correct in writing and in more formal speech."},{"id":"pre-6","kind":"fill","prompt":"She opens the window.","before":"Ela","after":"a janela.","answers":["abre"],"reveal":"abre","speak":"Ela abre a janela.","explain":"Abrir: eu abro, você abre, eles abrem. Janela is feminine, a janela. The first person abro is the irregular spot, not abre."},{"id":"pre-7","kind":"choice","tag":"Spoken Brazil","prompt":"Which progressive is Brazilian?","choices":["Estou a falar com ela.","Sou falando com ela.","Tô falando com ela.","Falo a ela gerúndio."],"answer":2,"speak":"Tô falando com ela.","explain":"Brazil uses estar plus the gerund: estou falando, tô comendo. Estou a falar is European Portuguese. Tô is spoken estou."}]},{"id":"verbos","kicker":"Aula 6","title":"Ir, ter, querer","blurb":"Go, have, want, can — and the contractions they drag along.","note":"A plus o becomes ao. Em plus a becomes na. De plus o becomes do. Age uses ter, never ser.","items":[{"id":"ver-1","kind":"choice","prompt":"I am going to the market.","choices":["Eu ir ao mercado.","Eu vou em o mercado.","Eu vou ao mercado.","Eu vou a o mercado."],"answer":2,"speak":"Eu vou ao mercado.","explain":"Ir: eu vou, você vai, eles vão. A plus o contracts to ao. A plus a is à, so à padaria. Nós vamos is the formal we; a gente vai is the spoken one."},{"id":"ver-2","kind":"fill","prompt":"Do you have time?","before":"Você","after":"tempo?","answers":["tem"],"reveal":"tem","speak":"Você tem tempo?","explain":"Ter: eu tenho, você tem, eles têm. The plural carries a circumflex: têm. Age is also ter: Eu tenho 30 anos, not eu sou 30."},{"id":"ver-3","kind":"fill","prompt":"I want water.","before":"Eu","after":"água.","answers":["quero"],"reveal":"quero","speak":"Eu quero água.","explain":"Querer: eu quero, você quer, eles querem. Quero água is natural. Quero uma água is a bottle or a glass of it."},{"id":"ver-4","kind":"build","prompt":"Build: May I come in?","tiles":["Posso","entrar","Pode","eu","agora"],"answer":["Posso","entrar"],"speak":"Posso entrar?","explain":"Poder: eu posso, você pode, eles podem. Posso entrar? is the request. Com licença also works at a doorway."},{"id":"ver-5","kind":"choice","prompt":"What is em plus a?","choices":["no","da","à","na"],"answer":3,"explain":"em plus o is no, em plus a is na, em plus os is nos, em plus as is nas. de plus o is do, de plus a is da. a plus a is à."},{"id":"ver-6","kind":"choice","prompt":"They have a car. Which plural is written right?","choices":["Eles tem um carro.","Eles teem um carro.","Eles têm um carro.","Eles tenho um carro."],"answer":2,"speak":"Eles têm um carro.","explain":"Ele tem, eles têm. The circumflex is doing real work: it marks the plural. The same pattern is ele vem, eles vêm."},{"id":"ver-7","kind":"fill","tag":"Informal","prompt":"We are going home. Use the spoken we.","before":"A gente","after":"pra casa.","answers":["vai"],"reveal":"vai","speak":"A gente vai pra casa.","explain":"A gente vai. Pra is spoken para. Pra casa means home. Vou pra casa and tô indo pra casa are both everyday."}]},{"id":"rua","kicker":"Aula 7","title":"Na rua","blurb":"Ask where things are, and admit you are lost.","note":"Onde fica is the question for a place. People on the street answer with à direita, à esquerda, and em frente.","items":[{"id":"rua-1","kind":"choice","prompt":"Where is the bathroom?","choices":["Onde é o banheiro ser?","Onde fica o banheiro?","Cadê fica o banho?","Onde está a banheiro?"],"answer":1,"speak":"Onde fica o banheiro?","explain":"Onde fica...? is how you ask where a place is. Banheiro is masculine. Cadê o banheiro? is the informal version, with no extra verb."},{"id":"rua-2","kind":"build","prompt":"Build: to the right.","tiles":["À","direita","A","esquerda","na","o"],"answer":["À","direita"],"speak":"À direita.","explain":"À direita, à esquerda, em frente. The accent on à is the contraction of a plus a. Without it, a direita is a different grammar."},{"id":"rua-3","kind":"fill","prompt":"Say that a place is close.","before":"Fica","after":".","answers":["perto","perto daqui"],"reveal":"perto","speak":"Fica perto.","explain":"Perto is near. Longe is far. Perto da praia, longe do centro. Daqui means from here."},{"id":"rua-4","kind":"choice","tag":"Spoken Brazil","prompt":"Which is what you will hear in Brazil?","choices":["Como eu chego no metrô?","Como eu chego o metrô?","Como eu chego para metrô?","Como eu chegar no metrô?"],"answer":0,"speak":"Como eu chego no metrô?","explain":"Grammar books prefer chegar a: chegar ao metrô. In Brazil, chegar em, no, and na is what people say. Both are understood."},{"id":"rua-5","kind":"choice","prompt":"You need a stranger to turn around. What do you say first?","choices":["Obrigado.","Falou.","De nada.","Com licença."],"answer":3,"speak":"Com licença.","explain":"Com licença, or Oi, por favor. Moço and moça still work and sound a bit old-fashioned. De nada is the reply to thanks, not an opener."},{"id":"rua-6","kind":"fill","prompt":"I live on this street.","before":"Eu moro","after":"rua.","answers":["nesta","nessa"],"reveal":"nesta","speak":"Eu moro nesta rua.","explain":"em plus esta is nesta. em plus essa is nessa. In Brazil, nesse and nessa often cover this as well as that. Moro em plus the place."},{"id":"rua-7","kind":"choice","prompt":"The speaker is a woman. She is lost.","choices":["Tô perdido.","Sou perdida.","Tô perdida.","Estou perder."],"answer":2,"speak":"Tô perdida.","tag":"Informal","explain":"Perdido or perdida agrees with the speaker. Use estar, not ser. Tô is the spoken form of estou. A man would say tô perdido."}]},{"id":"ontem","kicker":"Aula 8","title":"Ontem","blurb":"The simple past, for things that already finished.","note":"This is the pretérito perfeito: one completed event. Ontem, anteontem, semana passada. A gente still takes the singular.","items":[{"id":"ont-1","kind":"choice","prompt":"I went to the market.","choices":["Eu vou ao mercado.","Eu fui ao mercado.","Eu ia ao mercado.","Eu ido ao mercado."],"answer":1,"speak":"Eu fui ao mercado.","explain":"Fui, foi, foram are the simple past of both ir and ser. Context decides. Eu fui ao mercado means I went. Eu fui professora means I was a teacher."},{"id":"ont-2","kind":"fill","prompt":"We ate feijoada. Use a gente.","before":"A gente","after":"feijoada.","answers":["comeu"],"reveal":"comeu","speak":"A gente comeu feijoada.","explain":"A gente plus the singular past: comeu, foi, falou. Nós comemos is the formal we. Feijoada is feminine: a feijoada."},{"id":"ont-3","kind":"fill","prompt":"She did the homework.","before":"Ela","after":"a lição.","answers":["fez"],"reveal":"fez","speak":"Ela fez a lição.","explain":"Fazer in this past: eu fiz, você fez, eles fizeram. Fazer hora extra, fazer a mala, fazer a lição."},{"id":"ont-4","kind":"build","prompt":"Build: I spoke with her yesterday.","tiles":["Eu","falei","com","ela","ontem","falou","falo"],"answer":["Eu","falei","com","ela","ontem"],"speak":"Eu falei com ela ontem.","explain":"Falar com alguém. This past is for a finished event, pinned to yesterday or another closed time. Falei, not falou, because the subject is eu."},{"id":"ont-5","kind":"choice","prompt":"I was in Rio last week, and the trip is over.","choices":["Eu era no Rio.","Eu estive no Rio.","Eu sou no Rio.","Eu fui estar no Rio."],"answer":1,"speak":"Eu estive no Rio.","explain":"Estar in this past: estive, esteve, estiveram. Eu estive no Rio semana passada is a completed stay. Eu estava no Rio is for being there in the middle of a story."},{"id":"ont-6","kind":"choice","prompt":"Which phrase means last week?","choices":["semana que vem","esta semana","semana passada","semana próxima"],"answer":2,"speak":"semana passada","explain":"Passada means past. Que vem and próxima mean next. Ontem is yesterday. Anteontem is the day before yesterday."},{"id":"ont-7","kind":"fill","prompt":"I had a problem.","before":"Eu","after":"um problema.","answers":["tive"],"reveal":"tive","speak":"Eu tive um problema.","explain":"Ter in this past: tive, teve, tiveram. Tive um problema. Tive que sair means I had to leave. Problema stays masculine: um problema."}]},{"id":"jeito","kicker":"Aula 9","title":"Jeito brasileiro","blurb":"The shortenings. Fine with friends, wrong in a formal email.","note":"Speech drops letters: tá, tô, pra, pro, cê, né. Know them so you can understand. Use the full words with strangers and at work.","items":[{"id":"jei-1","kind":"choice","tag":"Informal","prompt":"Tá is the spoken form of which word?","line":"Tá bom.","speak":"Tá bom.","choices":["ser","tem","está","foi"],"answer":2,"explain":"Tá bom, tá tarde, cê tá bem? Tô is estou. In a message to a friend the letters fall off. In an email they should stay on."},{"id":"jei-2","kind":"choice","tag":"Informal","prompt":"What does valeu mean?","line":"Valeu!","speak":"Valeu!","choices":["Sorry.","Please.","Thanks.","Bye, and only bye."],"answer":2,"explain":"Valeu is informal thanks. It has no masculine or feminine form. Obrigado and obrigada are the neutral thanks. Brigado is even more clipped."},{"id":"jei-3","kind":"fill","tag":"Informal","prompt":"Ask where the key is, the informal way. No extra verb.","before":"","after":"a chave?","answers":["Cadê","cadê"],"reveal":"Cadê","speak":"Cadê a chave?","explain":"Cadê replaces onde está for things and people nearby. Cadê você? Cadê a chave? It does not take a second verb."},{"id":"jei-4","kind":"choice","tag":"Informal","prompt":"What is that little word doing at the end?","line":"É longe, né?","speak":"É longe, né?","choices":["It means please.","It is a tag, like right?","It means yesterday.","It marks the future."],"answer":1,"explain":"Né is não é, parked at the end of a sentence to check that you are with them. É longe, né? You can answer é, or na verdade não."},{"id":"jei-5","kind":"choice","prompt":"In conversation, what does legal usually mean?","line":"Que legal!","speak":"Que legal!","choices":["Against the law.","Expensive.","Cool.","Required by a court."],"answer":2,"explain":"Legal in conversation means cool, nice, or fine. Massa is more Northeast. Show is also awesome. The law meaning still exists, just not at a party."},{"id":"jei-6","kind":"fill","tag":"Informal","prompt":"Ask “you going?” with the clipped form of você.","before":"","after":"vai?","answers":["Cê","cê","Ce","ce"],"reveal":"Cê","speak":"Cê vai?","explain":"Cê is você with the first syllable worn off. Very common in speech and in chats. Do not put it in a formal email. Ce without the accent is how people often type it."},{"id":"jei-7","kind":"build","tag":"Informal","prompt":"Build the spoken sentence: I am heading to work.","tiles":["Tô","indo","pro","trabalho","Estou","para","o"],"answer":["Tô","indo","pro","trabalho"],"speak":"Tô indo pro trabalho.","explain":"Pro is para o. Tô indo is estou indo. This is what the sentence sounds like on the street. The full form is Estou indo para o trabalho."},{"id":"jei-8","kind":"choice","prompt":"Which opening fits a job interview?","choices":["E aí, beleza? Cê tá contratando?","Valeu, falou, tô indo.","Muito prazer. Eu trabalho com design.","Oi, mano. Cadê a vaga?"],"answer":2,"speak":"Muito prazer. Eu trabalho com design.","explain":"An interview wants the full forms and no slang. With friends, beleza, cê, valeu, and falou are welcome. Mano is buddy, and it does not belong in that room."}]}],"notes":[{"id":"tempos","title":"Presente, perfeito, imperfeito","lede":"Type the form. Hear it plays the sentence with this device’s Brazilian Portuguese voice.","rows":[{"left":"falo / falei / falava","right":"falar, eu"},{"left":"fala / falou / falava","right":"falar, você"},{"left":"falamos / falamos / falávamos","right":"falar, nós"},{"left":"falam / falaram / falavam","right":"falar, eles"},{"left":"sou / fui / era","right":"ser, eu"},{"left":"tenho / tive / tinha","right":"ter, eu"},{"left":"faço / fiz / fazia","right":"fazer, eu"},{"left":"vou / fui / ia","right":"ir, eu"}],"body":["Perfeito is one finished event: ontem, once. Imperfeito is a habit or the background: sempre, enquanto. Eu and você match in the imperfect.","Ir and ser share fui, foi, fomos, foram. Only ser, ter, vir, and pôr are irregular in the imperfect. Ir is regular there: ia, ia, íamos, iam."]},{"id":"voce","title":"Você, a gente, cê","lede":"Brazil defaults to você, not tu.","rows":[{"left":"você fala","right":"you speak"},{"left":"vocês falam","right":"you all speak"},{"left":"a gente fala","right":"we speak"},{"left":"nós falamos","right":"we speak, more formal"}],"body":["Tu is real in the South, the North, and parts of the Northeast, with its own endings. This course does not drill it.","Cê is você after a long day. Understand it. Skip it on a résumé."]},{"id":"ser-estar","title":"Ser e estar","lede":"One is identity. The other is the situation.","rows":[{"left":"ser","right":"who, origin, profession, lasting traits"},{"left":"estar","right":"mood, health, location, results"},{"left":"estar com fome","right":"to be hungry"},{"left":"estar com pressa","right":"to be in a hurry"}],"body":["Ela é médica. Ela está cansada. O café é bom. O café está quente. O bolo é de chocolate. O bolo está pronto.","People located somewhere take estar: O Pedro está no Rio. Origin takes ser: O Pedro é do Rio."]},{"id":"cola","title":"The little contractions","lede":"These are not optional in real sentences.","rows":[{"left":"de + o","right":"do"},{"left":"de + a","right":"da"},{"left":"em + o","right":"no"},{"left":"em + a","right":"na"},{"left":"a + o","right":"ao"},{"left":"a + a","right":"à"}],"body":["Eu vou ao mercado. Eu moro no Rio. A padaria fica na esquina. A chave é da Ana.","Pra is spoken para. Pro is para o. Pra casa means home."]},{"id":"agora","title":"Present, the useful slice","lede":"Three families. Você shares a column with ele.","rows":[{"left":"falar","right":"falo, fala, falam"},{"left":"comer","right":"como, come, comem"},{"left":"abrir","right":"abro, abre, abrem"},{"left":"ter + anos","right":"Eu tenho 30 anos"}],"body":["Negation sits in front of the verb: Eu não falo.","The Brazilian progressive is estar plus the gerund: tô falando. Estou a falar is Portugal."]},{"id":"passado","title":"A past that finished","lede":"Pretérito perfeito. One event, and it is over.","rows":[{"left":"falar","right":"falei, falou, falaram"},{"left":"ir / ser","right":"fui, foi, foram"},{"left":"ter","right":"tive, teve, tiveram"},{"left":"estar","right":"estive, esteve, estiveram"},{"left":"fazer","right":"fiz, fez, fizeram"}],"body":["A gente still takes the singular: a gente foi, a gente comeu.","Eu estive no Rio is the completed trip. Eu estava no Rio is the middle of the story. Semana passada is last week. Semana que vem is next week."]},{"id":"rua-fala","title":"Street shortenings","lede":"Learn them for listening. Choose them on purpose.","rows":[{"left":"está / estou","right":"tá / tô"},{"left":"para / para o","right":"pra / pro"},{"left":"você","right":"cê"},{"left":"não é","right":"né"},{"left":"onde está","right":"cadê"},{"left":"obrigado","right":"valeu"}],"body":["Legal mea <script>(function () {
  const payload = JSON.parse(document.getElementById("lab-data").textContent);
  const lessons = payload.lessons;
  const notes = payload.notes;
  const sketches = payload.sketches;
  const byLesson = {
    "cj-pres-reg": "speak",
    "cj-pres-irr-a": "door",
    "cj-pres-irr-b": "keys",
    "cj-perf-reg": "yesterday",
    "cj-perf-irr": "yesterday",
    "cj-imp-reg": "rain",
    "cj-imp-irr": "rain",
    "cj-fut-simp": "street",
    "cj-fut-irr": "keys",
    "cj-ppc": "yesterday",
    "cj-mqp": "rain",
    "cj-fut-comp": "street",
    "cj-cond-comp": "notebook",
    "cj-part-reg": "notebook",
    "cj-part-irr": "keys",
    oi: "greet",
    ser: "door",
    artigos: "table",
    boteco: "bar",
    presente: "speak",
    verbos: "keys",
    rua: "street",
    ontem: "yesterday",
    jeito: "greet",
  };

  const root = document.getElementById("app");
  const KEY = "portuguese-language-lab";
  let screen = { name: "home" };
  let confirmReset = false;
  let step = blankStep();

  function blankStep(item) {
    return {
      choice: null,
      text: "",
      picked: [],
      bank: item && item.kind === "build" ? seededOrder(item.tiles, item.id) : [],
      sel: null,
      matched: [],
      pairMisses: 0,
      checked: false,
      ok: false,
      shake: false,
      missing: false,
      ptOrder: item && item.kind === "pairs" ? seededOrder(item.pairs.map((p) => p.pt), item.id + ":pt") : [],
      enOrder: item && item.kind === "pairs" ? seededOrder(item.pairs.map((p) => p.en), item.id + ":en") : [],
    };
  }

  function loadProgress() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return emptyProgress();
      const parsed = JSON.parse(raw);
      return { ...emptyProgress(), ...parsed, stats: parsed.stats || {}, cleared: parsed.cleared || {} };
    } catch {
      return emptyProgress();
    }
  }
  function emptyProgress() {
    return { xp: 0, lastDay: null, stats: {}, cleared: {} };
  }
  let progress = loadProgress();
  function save() {
    localStorage.setItem(KEY, JSON.stringify(progress));
  }

  function norm(value) {
    return value.trim().toLowerCase().normalize("NFC").replace(/[.?!…,;:]+$/g, "").replace(/\s+/g, " ");
  }
  function seededOrder(list, seed) {
    const arr = list.slice();
    let hash = 2166136261;
    for (let i = 0; i < seed.length; i++) {
      hash ^= seed.charCodeAt(i);
      hash = Math.imul(hash, 16777619);
    }
    for (let i = arr.length - 1; i > 0; i--) {
      hash = Math.imul(hash, 1664525) + 1013904223;
      const j = (hash >>> 0) % (i + 1);
      const swap = arr[i];
      arr[i] = arr[j];
      arr[j] = swap;
    }
    return arr;
  }
  function lessonById(id) {
    return lessons.find((lesson) => lesson.id === id);
  }
  function sketchFor(id) {
    return byLesson[id] || "notebook";
  }
  function tone(id) {
    const name = sketchFor(id);
    if (name === "speak" || name === "door" || name === "street") return "tone-green";
    if (name === "yesterday" || name === "bar" || name === "keys") return "tone-clay";
    return "tone-gold";
  }
  function img(name, cls) {
    const sketch = sketches[name] || sketches.notebook;
    return `<img class="${cls}" src="${sketch.src}" alt="${esc(sketch.alt)}">`;
  }
  function esc(value) {
    const amp = String.fromCharCode(38);
    return String(value)
      .replace(/&/g, amp + "amp;")
      .replace(/</g, amp + "lt;")
      .replace(/>/g, amp + "gt;")
      .replace(/"/g, amp + "quot;");
  }
  function accuracy() {
    let correct = 0;
    let wrong = 0;
    for (const stat of Object.values(progress.stats)) {
      correct += stat.correct;
      wrong += stat.wrong;
    }
    const total = correct + wrong;
    if (!total) return null;
    return Math.round((100 * correct) / total);
  }
  function allItems() {
    return lessons.flatMap((lesson) => lesson.items);
  }
  function weakItems() {
    return allItems().filter((item) => {
      const stat = progress.stats[item.id];
      return stat && stat.wrong > stat.correct;
    });
  }
  function solution(item) {
    if (item.kind === "choice") return item.choices[item.answer] || "";
    if (item.kind === "fill") return item.reveal;
    if (item.kind === "build") return item.answer.join(" ");
    return item.pairs.map((pair) => `${pair.pt} — ${pair.en}`).join("\n");
  }
  function localDay(date) {
    const d = date || new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  function record(itemId, ok) {
    const prev = progress.stats[itemId] || { correct: 0, wrong: 0 };
    progress.stats[itemId] = {
      correct: prev.correct + (ok ? 1 : 0),
      wrong: prev.wrong + (ok ? 0 : 1),
    };
    progress.xp += ok ? 10 : 0;
    progress.lastDay = localDay();
    save();
  }
  function greeting() {
    const hour = new Date().getHours();
    if (hour < 12) return "Bom dia";
    if (hour < 18) return "Boa tarde";
    return "Boa noite";
  }
  function speak(text) {
    try {
      if (!("speechSynthesis" in window)) return false;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "pt-BR";
      utter.rate = 0.92;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
      return true;
    } catch {
      return false;
    }
  }

  function currentItem() {
    if (screen.name === "drill") return lessonById(screen.lessonId).items[screen.index];
    if (screen.name === "review") return screen.items[screen.index];
    return null;
  }

  function render() {
    const active = document.activeElement && document.activeElement.id;
    root.innerHTML = shell(view());
    if (active === "pt-answer") {
      const input = document.getElementById("pt-answer");
      if (input) {
        input.focus();
        const pos = input.value.length;
        input.setSelectionRange(pos, pos);
      }
    }
  }

  function shell(inner) {
    return `<div class="page"><svg class="calcada" viewBox="0 0 200 28" preserveAspectRatio="none" aria-hidden="true"><rect width="200" height="28" fill="#17241c"/><path d="M0 18C12 18 12 8 25 8C38 8 38 18 50 18C62 18 62 8 75 8C88 8 88 18 100 18C112 18 112 8 125 8C138 8 138 18 150 18C162 18 162 8 175 8C188 8 188 18 200 18V28H0Z" fill="#f4efe6"/><path d="M0 8C12 8 12 18 25 18C38 18 38 8 50 8C62 8 62 18 75 18C88 18 88 8 100 8C112 8 112 18 125 18C138 18 138 8 150 8C162 8 162 18 175 18C188 18 188 8 200 8V0H0Z" fill="#f4efe6"/></svg>${inner}</div>`;
  }

  function view() {
    if (screen.name === "home") return home();
    if (screen.name === "brief") return brief();
    if (screen.name === "drill" || screen.name === "review") return drill();
    if (screen.name === "done") return done();
    if (screen.name === "notes") return notebook();
    return home();
  }

  function home() {
    const verbs = lessons.filter((lesson) => lesson.track === "verbs");
    const phrases = lessons.filter((lesson) => lesson.track !== "verbs");
    const next = verbs.find((lesson) => !progress.cleared[lesson.id]) || phrases.find((lesson) => !progress.cleared[lesson.id]) || null;
    const pct = accuracy();
    const weak = weakItems();
    const rows = (list) =>
      list
        .map((lesson) => {
          const mastered = lesson.items.filter((item) => {
            const stat = progress.stats[item.id];
            return stat && stat.correct > stat.wrong;
          }).length;
          const cleared = progress.cleared[lesson.id];
          return `<li><button type="button" class="row ${tone(lesson.id)}" data-act="brief" data-id="${esc(lesson.id)}"><span class="thumb">${img(sketchFor(lesson.id), "thumb-img")}${cleared ? `<span class="tick">✓</span>` : ""}</span><span class="row-copy"><span class="row-title">${esc(lesson.title)}</span><span class="row-blurb">${esc(lesson.blurb)}</span></span><span class="count">${mastered}/${lesson.items.length}</span></button></li>`;
        })
        .join("");
    const groups = ["Presente", "Passado", "Futuro", "Composto"]
      .map((group) => {
        const items = verbs.filter((lesson) => lesson.group === group);
        if (!items.length) return "";
        const plain = items.filter((lesson) => !lesson.subgroup);
        const names = [];
        items.forEach((lesson) => {
          if (lesson.subgroup && !names.includes(lesson.subgroup)) names.push(lesson.subgroup);
        });
        const nested = names
          .map((name) => {
            const sub = items.filter((lesson) => lesson.subgroup === name);
            return `<h4 class="sub">${esc(name)}</h4><ol class="list">${rows(sub)}</ol>`;
          })
          .join("");
        return `<h3 class="group">${esc(group)}</h3>${plain.length ? `<ol class="list">${rows(plain)}</ol>` : ""}${nested}`;
      })
      .join("");
    return `<main class="pad">
      <p class="hello">${esc(greeting())}.</p>
      <h1>Portuguese Language Lab</h1>
      <p class="lede">Type the verb, then hear the sentence on this device. Present, past, future, and the compound forms.</p>
      ${img("notebook", "hero")}
      <button type="button" class="continue" data-act="brief" data-id="${esc((next || lessons[0]).id)}"><span class="kicker">${next ? "Continue" : "Run it again"}</span><span class="continue-title">${esc(next ? next.title : verbs[0].title)} <span aria-hidden="true">→</span></span></button>
      <div class="stats"><div class="stat"><p>XP</p><strong>${progress.xp}</strong></div><div class="stat"><p>Accuracy</p><strong>${pct == null ? "—" : pct + "%"}</strong></div></div>
      <h2>Verb lab</h2>
      <p class="hint">Type each form. Hear it uses this phone or computer’s Brazilian Portuguese voice.</p>
      ${groups}
      <h2>Everyday phrases</h2>
      <ol class="list">${rows(phrases)}</ol>
      <button type="button" class="secondary" data-act="notes">Grammar notebook</button>
      <button type="button" class="secondary" data-act="review" ${weak.length === 0 ? "disabled" : ""}>${weak.length === 0 ? "No mistakes waiting" : `Review mistakes (${weak.length})`}</button>
      ${progress.xp > 0 || progress.lastDay ? `<div class="reset">${confirmReset ? `<button type="button" class="secondary" data-act="keep">Keep it</button><button type="button" class="secondary" data-act="wipe">Yes, clear it</button>` : `<button type="button" class="link" data-act="ask-reset">Clear saved progress</button>`}</div>` : ""}
    </main>`;
  }

  function brief() {
    const lesson = lessonById(screen.lessonId);
    return `<main class="pad">
      <button type="button" class="back" data-act="home">← Lessons</button>
      ${img(sketchFor(lesson.id), "hero")}
      <p class="hello">${esc(lesson.kicker)}</p>
      <h1>${esc(lesson.title)}</h1>
      <p class="lede">${esc(lesson.blurb)}</p>
      <div class="note ${tone(lesson.id)}"><p class="note-k">Before you start</p><p>${esc(lesson.note)}</p>${lesson.rows && lesson.rows.length ? `<dl class="chart">${lesson.rows.map((row) => `<div class="pair-row"><dt>${esc(row.left)}</dt><dd>${esc(row.right)}</dd></div>`).join("")}</dl>` : ""}</div>
      <p class="hint">${lesson.items.length} exercises. A few minutes.</p>
      <button type="button" class="primary" data-act="start">Start</button>
    </main>`;
  }

  function drill() {
    const item = currentItem();
    const items = screen.name === "drill" ? lessonById(screen.lessonId).items : screen.items;
    const kicker = screen.name === "drill" ? lessonById(screen.lessonId).kicker : "Revisão";
    const title = screen.name === "drill" ? lessonById(screen.lessonId).title : "Mistakes";
    const sketchName = screen.name === "drill" ? sketchFor(screen.lessonId) : "notebook";
    const toneClass = screen.name === "drill" ? tone(screen.lessonId) : "tone-gold";
    const showListen = item.kind !== "pairs" && item.speak && ((item.kind === "fill" && item.model) || (item.kind === "choice" && item.line));
    const ready =
      item.kind === "choice"
        ? step.choice !== null
        : item.kind === "fill"
          ? step.text.trim().length > 0
          : item.kind === "build"
            ? step.picked.length > 0
            : step.matched.length === item.pairs.length;
    return `<div class="drill">
      <header class="drill-head">
        <button type="button" class="back-round" data-act="home" aria-label="Back to lessons">←</button>
        <div><p class="hello tight">${esc(kicker)}</p><p class="drill-title">${esc(title)}</p></div>
        <p class="count">${screen.index + 1}/${items.length}</p>
      </header>
      <div class="bar"><span style="width:${(screen.index / items.length) * 100}%"></span></div>
      <button type="button" class="clear" data-act="clear">Clear answers</button>
      <div class="drill-body">
        <div class="card ${toneClass}">
          ${img(sketchName, "card-img")}
          <div class="prompt-row"><p>${esc(item.prompt)}</p>${item.tag ? `<span class="tag">${esc(item.tag)}</span>` : ""}</div>
          ${item.line ? `<p class="line">${esc(item.line)}</p>` : ""}
          ${item.kind === "fill" ? `<p class="sentence">${esc(item.before)}${item.before ? " " : ""}<span class="blank" id="blank">${esc(step.text.trim() || "____")}</span>${item.after ? " " + esc(item.after) : ""}</p>` : ""}
          ${showListen ? hearButton() : ""}
        </div>
        <div class="answer">${answerBlock(item)}</div>
        ${step.checked ? feedback(item, showListen) : ""}
      </div>
      <div class="dock">${step.checked ? `<button type="button" class="primary" data-act="next">${screen.index + 1 === items.length ? "See results" : "Continue"}</button>` : `<button type="button" class="primary" data-act="check" ${ready ? "" : "disabled"}>Check</button>`}</div>
    </div>`;
  }

  function hearButton() {
    return `<button type="button" class="hear" data-act="hear">${step.missing ? "This browser has no speech voice." : "Hear it"}</button>`;
  }

  function answerBlock(item) {
    if (item.kind === "choice") {
      return item.choices
        .map((option, index) => {
          const selected = step.choice === index;
          const correct = step.checked && index === item.answer;
          const wrong = step.checked && selected && !correct;
          const cls = correct ? "opt good" : wrong ? "opt bad" : !step.checked && selected ? "opt good" : "opt";
          return `<button type="button" class="${cls}" data-act="choice" data-i="${index}" ${step.checked ? "disabled" : ""}>${esc(option)}</button>`;
        })
        .join("");
    }
    if (item.kind === "fill") {
      return `<label class="hint" for="pt-answer">${item.model ? "Type the conjugation" : "Type in Portuguese"}</label><input id="pt-answer" lang="pt-BR" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${step.checked ? "disabled" : ""} value="${esc(step.text)}">`;
    }
    if (item.kind === "build") {
      const picked =
        step.picked.length === 0
          ? `<span class="hint">Tap the words in order.</span>`
          : step.picked.map((tile, index) => `<button type="button" class="tile on" data-act="unpick" data-i="${index}" ${step.checked ? "disabled" : ""}>${esc(tile)}</button>`).join("");
      const bank = step.bank.map((tile, index) => `<button type="button" class="tile" data-act="pick" data-i="${index}" ${step.checked ? "disabled" : ""}>${esc(tile)}</button>`).join("");
      return `<div class="tray">${picked}</div><div class="bank">${bank}</div>`;
    }
    const pairEn = new Map(item.pairs.map((pair) => [pair.pt, pair.en]));
    const matchedEn = new Set(step.matched.map((pt) => pairEn.get(pt)));
    const col = (side, values) =>
      values
        .map((value) => {
          const done = side === "pt" ? step.matched.includes(value) : matchedEn.has(value);
          const selected = step.sel && step.sel.side === side && step.sel.value === value;
          return `<button type="button" class="opt ${done ? "done" : ""} ${selected ? "good" : ""}" data-act="pair" data-side="${side}" data-v="${esc(value)}" ${done || step.checked ? "disabled" : ""}>${esc(value)}</button>`;
        })
        .join("");
    return `<div class="pairs ${step.shake ? "shake" : ""}"><div>${col("pt", step.ptOrder)}</div><div>${col("en", step.enOrder)}</div></div>`;
  }

  function feedback(item, showListen) {
    const answer = !step.ok && item.kind !== "pairs" ? `<p class="reveal">${esc(solution(item))}</p>` : "";
    const pairs = !step.ok && item.kind === "pairs" ? `<ul class="pairs-key">${item.pairs.map((pair) => `<li>${esc(pair.pt)} — ${esc(pair.en)}</li>`).join("")}</ul>` : "";
    const later = !showListen && item.kind !== "pairs" && item.speak ? hearButton() : "";
    return `<div class="feedback ${step.ok ? "tone-green" : "tone-clay"}"><p class="${step.ok ? "good-t" : "bad-t"}">${step.ok ? "Certo." : "Quase."}</p>${answer}${pairs}<p class="explain">${esc(item.explain)}</p>${later}</div>`;
  }

  function done() {
    const ratio = screen.total ? screen.correct / screen.total : 0;
    const headline = screen.review ? (ratio === 1 ? "Limpo." : "Ainda tem resto.") : ratio === 1 ? "Mandou bem." : ratio >= 0.8 ? "Aula feita." : "Ainda não.";
    const detail = screen.review
      ? "A miss leaves the pile only after you have more correct answers than wrong ones."
      : ratio >= 0.8
        ? "Eighty percent clears a lesson. This one is yours."
        : "Eighty percent clears it. The misses are saved for review.";
    const index = screen.lessonId ? lessons.findIndex((lesson) => lesson.id === screen.lessonId) : -1;
    const next = index >= 0 ? lessons[index + 1] : null;
    const xp = screen.correct * 10 + screen.bonus;
    const misses = screen.misses
      .map(
        (miss) =>
          `<li class="miss"><p class="hint">${esc(miss.prompt)}</p><p class="reveal">${esc(miss.answer)}</p></li>`,
      )
      .join("");
    return `<main class="pad">
      <p class="hello">${esc(screen.title)}</p>
      ${screen.lessonId ? img(sketchFor(screen.lessonId), "hero") : ""}
      <h1>${headline}</h1>
      <p class="score">${screen.correct}<span> / ${screen.total}</span></p>
      <p class="lede">${detail}</p>
      <p class="xp">+${xp} XP${screen.bonus ? `, including ${screen.bonus} for clearing it` : ""}</p>
      ${misses ? `<h2>Misses</h2><ul class="list">${misses}</ul>` : ""}
      ${next ? `<button type="button" class="primary" data-act="brief" data-id="${esc(next.id)}">Next lesson</button>` : ""}
      ${screen.lessonId ? `<button type="button" class="secondary" data-act="again">Run this lesson again</button>` : ""}
      <button type="button" class="secondary" data-act="home">Back to lessons</button>
    </main>`;
  }

  function notebook() {
    const cards = notes
      .map(
        (note) => `<article class="note tone-gold"><h2>${esc(note.title)}</h2><p class="hint">${esc(note.lede)}</p><dl>${note.rows
          .map((row) => `<div class="pair-row"><dt>${esc(row.left)}</dt><dd>${esc(row.right)}</dd></div>`)
          .join("")}</dl>${note.body.map((paragraph) => `<p class="explain">${esc(paragraph)}</p>`).join("")}</article>`,
      )
      .join("");
    return `<main class="pad"><button type="button" class="back" data-act="home">← Lessons</button>${img("notebook", "hero")}<h1>Caderno</h1><p class="lede">The six pages worth keeping open. Drills use these, they do not replace them.</p>${cards}</main>`;
  }

  function grade() {
    const item = currentItem();
    if (!item || step.checked) return;
    let ok = false;
    if (item.kind === "choice") ok = step.choice === item.answer;
    else if (item.kind === "fill") ok = item.answers.some((answer) => norm(answer) === norm(step.text));
    else if (item.kind === "build") ok = step.picked.length === item.answer.length && step.picked.every((tile, index) => tile === item.answer[index]);
    else ok = step.pairMisses === 0 && step.matched.length === item.pairs.length;
    step.checked = true;
    step.ok = ok;
    record(item.id, ok);
    screen.attempts.push({ id: item.id, ok });
    render();
  }

  function finish() {
    const items = screen.name === "drill" ? lessonById(screen.lessonId).items : screen.items;
    const correct = screen.attempts.filter((attempt) => attempt.ok).length;
    const ratio = items.length ? correct / items.length : 0;
    let bonus = 0;
    if (screen.name === "drill" && ratio >= 0.8 && !progress.cleared[screen.lessonId]) {
      bonus = 20;
      progress.xp += 20;
      progress.cleared[screen.lessonId] = true;
      save();
    }
    const misses = screen.attempts
      .filter((attempt) => !attempt.ok)
      .map((attempt) => {
        const item = items.find((entry) => entry.id === attempt.id);
        return item ? { prompt: item.prompt, answer: solution(item) } : null;
      })
      .filter(Boolean);
    const title = screen.name === "drill" ? lessonById(screen.lessonId).title : "Review";
    const lessonId = screen.name === "drill" ? screen.lessonId : null;
    const review = screen.name === "review";
    screen = { name: "done", lessonId, title, correct, total: items.length, bonus, review, misses };
    render();
  }

  function pickPair(side, value) {
    const item = currentItem();
    if (!item || item.kind !== "pairs" || step.checked) return;
    const pairEn = new Map(item.pairs.map((pair) => [pair.pt, pair.en]));
    const matchedEn = new Set(step.matched.map((pt) => pairEn.get(pt)));
    if (side === "pt" && step.matched.includes(value)) return;
    if (side === "en" && matchedEn.has(value)) return;
    if (!step.sel || step.sel.side === side) {
      step.sel = { side, value };
      render();
      return;
    }
    const pt = side === "pt" ? value : step.sel.value;
    const en = side === "en" ? value : step.sel.value;
    if (pairEn.get(pt) === en) {
      step.matched.push(pt);
      step.sel = null;
      speak(pt);
      render();
      return;
    }
    step.pairMisses += 1;
    step.sel = null;
    step.shake = true;
    render();
    window.setTimeout(() => {
      step.shake = false;
      render();
    }, 200);
  }

  document.addEventListener("click", (event) => {
    const el = event.target.closest("[data-act]");
    if (!el || el.disabled) return;
    const act = el.dataset.act;
    if (act === "home") {
      screen = { name: "home" };
      render();
    } else if (act === "brief") {
      screen = { name: "brief", lessonId: el.dataset.id };
      render();
    } else if (act === "notes") {
      screen = { name: "notes" };
      render();
    } else if (act === "review") {
      const items = weakItems();
      if (!items.length) return;
      screen = { name: "review", items, index: 0, attempts: [] };
      step = blankStep(items[0]);
      render();
    } else if (act === "clear") {
      if (screen.name !== "drill" && screen.name !== "review") return;
      const items = screen.name === "drill" ? lessonById(screen.lessonId).items : screen.items;
      screen.index = 0;
      screen.attempts = [];
      step = blankStep(items[0]);
      render();
    } else if (act === "start" || act === "again") {
      const lessonId = act === "again" ? screen.lessonId : screen.lessonId;
      const lesson = lessonById(lessonId);
      screen = { name: "drill", lessonId: lesson.id, index: 0, attempts: [] };
      step = blankStep(lesson.items[0]);
      render();
    } else if (act === "ask-reset") {
      confirmReset = true;
      render();
    } else if (act === "keep") {
      confirmReset = false;
      render();
    } else if (act === "wipe") {
      progress = emptyProgress();
      save();
      confirmReset = false;
      render();
    } else if (act === "choice") {
      if (!step.checked) {
        step.choice = Number(el.dataset.i);
        render();
      }
    } else if (act === "pick") {
      const index = Number(el.dataset.i);
      const tile = step.bank[index];
      step.picked.push(tile);
      step.bank.splice(index, 1);
      render();
    } else if (act === "unpick") {
      const index = Number(el.dataset.i);
      const tile = step.picked[index];
      step.picked.splice(index, 1);
      step.bank.push(tile);
      render();
    } else if (act === "pair") {
      pickPair(el.dataset.side, el.dataset.v);
    } else if (act === "hear") {
      const item = currentItem();
      const text = item && item.speak ? item.speak : el.dataset.v;
      step.missing = text ? !speak(text) : true;
      if (step.missing) render();
    } else if (act === "check") {
      grade();
    } else if (act === "next") {
      const items = screen.name === "drill" ? lessonById(screen.lessonId).items : screen.items;
      if (screen.index + 1 >= items.length) finish();
      else {
        screen.index += 1;
        step = blankStep(items[screen.index]);
        render();
      }
    }
  });

  document.addEventListener("input", (event) => {
    if (event.target.id !== "pt-answer") return;
    step.text = event.target.value;
    const blank = document.getElementById("blank");
    if (blank) blank.textContent = step.text.trim() || "____";
    const button = document.querySelector("[data-act='check']");
    if (button) button.disabled = step.text.trim().length === 0;
  });

  document.addEventListener("keydown", (event) => {
    if (event.key !== "Enter") return;
    if (event.target instanceof HTMLButtonElement) return;
    const item = currentItem();
    if (!item || step.checked) return;
    if (item.kind === "fill" && step.text.trim()) {
      event.preventDefault();
      grade();
    }
  });

  render();
})();
</script>
</body>
</html>
