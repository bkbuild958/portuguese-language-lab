<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portuguese Language Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root {
  --areia: #f4efe6;
  --marfim: #fbf8f1;
  --tinta: #17241c;
  --musgo: #445046;
  --fio: #e0d8c8;
  --folha: #1e5c3f;
  --folha-soft: #e3f0e7;
  --ouro: #8a6a2f;
  --ouro-soft: #f3ead4;
  --barro: #8f3d2c;
  --barro-soft: #f8ebe6;
  color: var(--tinta);
  background: var(--areia);
  font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
  line-height: 1.5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--areia); }
button, input { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: 0.55; }
h1, h2 { font-family: Fraunces, Georgia, serif; font-weight: 560; text-wrap: balance; }
h1 { margin: 4px 0 0; font-size: 2.35rem; line-height: 1.05; }
h2 { margin: 1.6rem 0 0; font-size: 1.6rem; }
h3.group { margin: 1.15rem 0 0.15rem; font-family: Outfit, ui-sans-serif, system-ui, sans-serif; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ouro); }
h4.sub { margin: 0.85rem 0 0.15rem; font-size: 1rem; font-weight: 600; }
.clear { align-self: flex-start; margin: 0.75rem 1rem 0; min-height: 2.25rem; border-radius: 999px; border: 1px solid var(--fio); background: var(--marfim); color: var(--musgo); padding: 0 0.9rem; }
p { text-wrap: pretty; }
.page { max-width: 32rem; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.calcada { display: block; width: 100%; height: 1.75rem; }
.pad { padding: 1.25rem 1.25rem 2.5rem; display: flex; flex-direction: column; gap: 0; flex: 1; }
.hello { min-height: 1.75rem; margin: 0; font-family: Fraunces, Georgia, serif; font-style: italic; color: var(--folha); font-size: 1.15rem; }
.hello.tight { min-height: 0; line-height: 1; }
.lede { margin: 0.75rem 0 0; color: var(--musgo); max-width: 24rem; }
.hint { margin: 0.35rem 0 0; color: var(--musgo); font-size: 0.92rem; }
.hero, .card-img { width: 100%; object-fit: cover; border: 1px solid var(--fio); background: var(--marfim); border-radius: 1.4rem; }
.hero { height: 10rem; margin-top: 1.1rem; }
.card-img { height: 10rem; margin-bottom: 1rem; border-radius: 1rem; }
.continue { margin-top: 1.25rem; border: 0; border-radius: 1rem; background: var(--folha); color: var(--areia); text-align: left; padding: 1rem 1.15rem; }
.continue .kicker { display: block; color: #cfe3d6; font-size: 0.92rem; }
.continue-title { display: flex; justify-content: space-between; gap: 0.75rem; margin-top: 0.25rem; font-family: Fraunces, Georgia, serif; font-size: 1.5rem; line-height: 1.15; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 1rem; }
.stat { border: 1px solid var(--fio); background: var(--marfim); border-radius: 1rem; padding: 0.75rem; }
.stat p { margin: 0; color: var(--musgo); font-size: 0.78rem; }
.stat strong { display: block; margin-top: 0.2rem; font-family: Fraunces, Georgia, serif; font-size: 1.6rem; font-weight: 560; }
.list { list-style: none; margin: 0.7rem 0 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
.row { width: 100%; display: flex; align-items: center; gap: 0.75rem; text-align: left; border: 1px solid var(--fio); border-radius: 1rem; padding: 0.7rem; }
.thumb { position: relative; width: 3.5rem; height: 3.5rem; flex: none; }
.thumb-img { width: 100%; height: 100%; object-fit: cover; border-radius: 0.75rem; border: 1px solid var(--fio); }
.tick { position: absolute; right: 2px; bottom: 2px; width: 1.15rem; height: 1.15rem; border-radius: 999px; background: var(--folha); color: var(--areia); font-size: 0.72rem; display: grid; place-items: center; }
.row-copy { min-width: 0; flex: 1; }
.row-title { display: block; font-weight: 560; }
.row-blurb { display: block; color: var(--musgo); font-size: 0.88rem; }
.count { color: var(--musgo); font-variant-numeric: tabular-nums; font-size: 0.88rem; }
.tone-green { background: var(--folha-soft); }
.tone-clay { background: var(--barro-soft); }
.tone-gold { background: var(--ouro-soft); }
.secondary, .primary, .link { margin-top: 0.55rem; }
.secondary { min-height: 3rem; border-radius: 1rem; border: 1px solid var(--fio); background: var(--marfim); }
.primary { min-height: 3.25rem; border: 0; border-radius: 1rem; background: var(--folha); color: var(--areia); font-weight: 560; }
.link { background: none; border: 0; color: var(--musgo); text-decoration: underline; text-underline-offset: 4px; min-height: 2.75rem; }
.reset { margin-top: 1.5rem; display: flex; gap: 0.5rem; }
.back { align-self: flex-start; background: none; border: 0; color: var(--musgo); min-height: 2.75rem; padding: 0; }
.note { margin-top: 1.25rem; border: 1px solid var(--fio); border-radius: 1rem; padding: 1rem; }
.note-k { margin: 0; color: var(--ouro); font-weight: 560; font-size: 0.92rem; }
.note p + p { margin: 0.5rem 0 0; }
.drill { display: flex; flex-direction: column; min-height: calc(100vh - 1.75rem); }
.drill-head { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; }
.back-round { width: 2.75rem; height: 2.75rem; border-radius: 999px; border: 1px solid var(--fio); background: var(--marfim); flex: none; }
.drill-title { margin: 0.15rem 0 0; font-weight: 560; }
.bar { height: 4px; margin: 0 1rem; background: var(--fio); border-radius: 999px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--folha); }
.drill-body { flex: 1; overflow: auto; padding: 1.1rem 1rem 1rem; }
.card { border-radius: 1.5rem; padding: 1rem; }
.prompt-row { display: flex; justify-content: space-between; gap: 0.75rem; }
.prompt-row p { margin: 0; }
.tag { flex: none; background: var(--marfim); color: var(--ouro); border-radius: 999px; padding: 0.2rem 0.6rem; font-size: 0.75rem; font-weight: 560; }
.line, .sentence, .score, .reveal { font-family: Fraunces, Georgia, serif; }
.line { margin: 1rem 0 0; font-size: 1.8rem; line-height: 1.15; }
.sentence { margin: 1rem 0 0; font-size: 1.45rem; line-height: 1.3; }
.blank { border-bottom: 2px solid var(--folha); color: var(--folha); padding: 0 0.15rem; }
.hear { margin-top: 0.9rem; min-height: 2.75rem; border-radius: 999px; border: 1px solid var(--fio); background: var(--marfim); padding: 0 0.9rem; }
.answer { margin-top: 1.1rem; display: flex; flex-direction: column; gap: 0.5rem; }
.opt { min-height: 3rem; text-align: left; border-radius: 1rem; border: 1px solid var(--fio); background: var(--marfim); padding: 0.7rem 0.9rem; }
.opt.good { border-color: var(--folha); background: var(--folha-soft); }
.opt.bad { border-color: var(--barro); background: var(--barro-soft); }
.opt.done { border-color: var(--folha); background: var(--folha); color: var(--areia); }
input { margin-top: 0.4rem; min-height: 3rem; width: 100%; border-radius: 1rem; border: 1px solid var(--fio); background: var(--marfim); padding: 0 0.9rem; font-size: 1.1rem; color: var(--tinta); }
input:focus { outline: 2px solid var(--folha); border-color: var(--folha); }
.tray, .bank { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.tray { min-height: 4rem; border: 1px dashed var(--fio); background: var(--marfim); border-radius: 1rem; padding: 0.75rem; }
.tile { min-height: 2.75rem; border-radius: 0.75rem; border: 1px solid var(--fio); background: var(--areia); padding: 0 0.75rem; }
.tile.on { border-color: var(--folha); background: var(--folha-soft); }
.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
.feedback { margin-top: 1.1rem; border-radius: 1rem; padding: 0.85rem 1rem; }
.good-t { color: var(--folha); font-weight: 600; margin: 0; }
.bad-t { color: var(--barro); font-weight: 600; margin: 0; }
.reveal { margin: 0.45rem 0 0; font-size: 1.25rem; white-space: pre-line; }
.explain { margin: 0.45rem 0 0; font-size: 0.92rem; }
.dock { border-top: 1px solid var(--fio); padding: 1rem; }
.dock .primary { width: 100%; margin: 0; }
.score { margin: 0.8rem 0 0; font-size: 2rem; }
.score span, .xp { color: var(--musgo); }
.xp { color: var(--ouro); font-variant-numeric: tabular-nums; }
.miss { border: 1px solid var(--fio); background: var(--marfim); border-radius: 1rem; padding: 0.8rem 1rem; }
dl { margin: 0.6rem 0 0; }
.pair-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; border-top: 1px solid var(--fio); padding: 0.45rem 0; font-size: 0.92rem; }
dd { margin: 0; color: var(--musgo); }
.shake { animation: shake 180ms ease-in-out; }
@keyframes shake {
  30% { transform: translateX(-4px); }
  70% { transform: translateX(4px); }
}
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
:focus-visible { outline: 2px solid var(--folha); outline-offset: 2px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="lab-data">{"lessons":[{"id":"cj-pres-reg","track":"verbs","group":"Presente","kicker":"Presente","title":"Regular: -ar, -er, -ir","blurb":"Type the present of trabalhar, beber, and decidir.","note":"Endings: trabalho, trabalha, trabalhamos, trabalham · bebo, bebe, bebemos, bebem · decido, decide, decidimos, decidem. Você, ele, ela, and a gente share one form. Hear it uses this phone or computer’s Brazilian Portuguese voice, not a Portugal one.","items":[{"id":"cj-pr-trabalhar-eu","kind":"fill","model":true,"tag":"Regular","prompt":"Presente · trabalhar · eu","before":"Eu","after":"de manhã.","answers":["trabalho"],"reveal":"trabalho","speak":"Eu trabalho de manhã.","explain":"Regular -ar, eu: drop -ar and add -o. Trabalho, trabalha, trabalhamos, trabalham."},{"id":"cj-pr-trabalhar-voce","kind":"fill","model":true,"tag":"Regular","prompt":"Presente · trabalhar · você","before":"Você","after":"aqui.","answers":["trabalha"],"reveal":"trabalha","speak":"Você trabalha aqui.","explain":"Você uses the same present as ele and ela: trabalha. Not trabalhas. That ending belongs to tu."},{"id":"cj-pr-trabalhar-nos","kind":"fill","model":true,"tag":"Regular","prompt":"Presente · trabalhar · nós","before":"Nós","after":"todo dia.","answers":["trabalhamos"],"reveal":"trabalhamos","speak":"Nós trabalhamos todo dia.","explain":"Nós keeps the -ar theme: trabalhamos. A gente would be trabalha, singular."},{"id":"cj-pr-trabalhar-eles","kind":"fill","model":true,"tag":"Regular","prompt":"Presente · trabalhar · eles","before":"Eles","after":"pouco.","answers":["trabalham"],"reveal":"trabalham","speak":"Eles trabalham pouco.","explain":"Eles, elas, and vocês share trabalham."},{"id":"cj-pr-beber-eu","kind":"fill","model":true,"tag":"Regular","prompt":"Presente · beber · eu","before":"Eu","after":"café.","answers":["bebo"],"reveal":"bebo","speak":"Eu bebo café.","explain":"Regular -er, eu: bebo. The pattern is bebo, bebe, bebemos, bebem."},{"id":"cj-pr-beber-voce","kind":"fill","model":true,"tag":"Regular","prompt":"Presente · beber · você","before":"Você","after":"água.","answers":["bebe"],"reveal":"bebe","speak":"Você bebe água.","explain":"Você bebe. Same form as ele and ela."},{"id":"cj-pr-beber-nos","kind":"fill","model":true,"tag":"Regular","prompt":"Presente · beber · nós","before":"Nós","after":"suco.","answers":["bebemos"],"reveal":"bebemos","speak":"Nós bebemos suco.","explain":"Nós bebemos. This spelling is also the simple past. Here there is no past cue, so it is present."},{"id":"cj-pr-beber-eles","kind":"fill","model":true,"tag":"Regular","prompt":"Presente · beber · eles","before":"Eles","after":"chá.","answers":["bebem"],"reveal":"bebem","speak":"Eles bebem chá.","explain":"Eles bebem. Vocês bebem too."},{"id":"cj-pr-decidir-eu","kind":"fill","model":true,"tag":"Regular","prompt":"Presente · decidir · eu","before":"Eu","after":"agora.","answers":["decido"],"reveal":"decido","speak":"Eu decido agora.","explain":"Regular -ir, eu: decido. The set is decido, decide, decidimos, decidem."},{"id":"cj-pr-decidir-voce","kind":"fill","model":true,"tag":"Regular","prompt":"Presente · decidir · você","before":"Você","after":"o filme.","answers":["decide"],"reveal":"decide","speak":"Você decide o filme.","explain":"Você decide. Ele decide, a gente decide."},{"id":"cj-pr-decidir-nos","kind":"fill","model":true,"tag":"Regular","prompt":"Presente · decidir · nós","before":"Nós","after":"juntos.","answers":["decidimos"],"reveal":"decidimos","speak":"Nós decidimos juntos.","explain":"Nós decidimos. Same spelling in the present and in the simple past."},{"id":"cj-pr-decidir-eles","kind":"fill","model":true,"tag":"Regular","prompt":"Presente · decidir · eles","before":"Eles","after":"rápido.","answers":["decidem"],"reveal":"decidem","speak":"Eles decidem rápido.","explain":"Eles decidem. Vocês decidem."}]},{"id":"cj-pres-irr-a","track":"verbs","group":"Presente","kicker":"Presente","title":"Irregular: ser, estar, ir","blurb":"The three verbs that refuse the regular endings.","note":"Ser: sou, é, somos, são. Estar: estou, está, estamos, estão. Ir: vou, vai, vamos, vão. None of these follow -ar, -er, or -ir.","items":[{"id":"cj-pr-ser-eu","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · ser · eu","before":"Eu","after":"de São Paulo.","answers":["sou"],"reveal":"sou","speak":"Eu sou de São Paulo.","explain":"Ser, eu: sou. Not so. Origin uses ser: eu sou de São Paulo."},{"id":"cj-pr-ser-voce","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · ser · você","before":"Você","after":"de São Paulo.","answers":["é"],"reveal":"é","speak":"Você é de São Paulo.","explain":"Você é. Ele é, ela é, a gente é. The accent on é is required."},{"id":"cj-pr-ser-nos","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · ser · nós","before":"Nós","after":"amigos.","answers":["somos"],"reveal":"somos","speak":"Nós somos amigos.","explain":"Nós somos. A gente é, not a gente somos."},{"id":"cj-pr-ser-eles","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · ser · eles","before":"Eles","after":"brasileiros.","answers":["são"],"reveal":"são","speak":"Eles são brasileiros.","explain":"Eles são. The tilde is the plural of é."},{"id":"cj-pr-estar-eu","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · estar · eu","before":"Eu","after":"em casa.","answers":["estou"],"reveal":"estou","speak":"Eu estou em casa.","explain":"Estar, eu: estou. In speech this is often tô. Type the full form here."},{"id":"cj-pr-estar-voce","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · estar · você","before":"Você","after":"bem.","answers":["está"],"reveal":"está","speak":"Você está bem.","explain":"Você está. Esta without the accent is a different word. Tá is the spoken short form."},{"id":"cj-pr-estar-nos","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · estar · nós","before":"Nós","after":"prontos.","answers":["estamos"],"reveal":"estamos","speak":"Nós estamos prontos.","explain":"Nós estamos. Location and temporary states take estar, not ser."},{"id":"cj-pr-estar-eles","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · estar · eles","before":"Eles","after":"no trabalho.","answers":["estão"],"reveal":"estão","speak":"Eles estão no trabalho.","explain":"Eles estão. No is em plus o."},{"id":"cj-pr-ir-eu","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · ir · eu","before":"Eu","after":"ao centro.","answers":["vou"],"reveal":"vou","speak":"Eu vou ao centro.","explain":"Ir, eu: vou. Ao is a plus o."},{"id":"cj-pr-ir-voce","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · ir · você","before":"Você","after":"de metrô.","answers":["vai"],"reveal":"vai","speak":"Você vai de metrô.","explain":"Você vai. Ele vai, a gente vai."},{"id":"cj-pr-ir-nos","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · ir · nós","before":"Nós","after":"agora.","answers":["vamos"],"reveal":"vamos","speak":"Nós vamos agora.","explain":"Nós vamos. Vamos is also the let's-go form: vamos embora."},{"id":"cj-pr-ir-eles","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · ir · eles","before":"Eles","after":"embora.","answers":["vão"],"reveal":"vão","speak":"Eles vão embora.","explain":"Eles vão. The tilde marks this plural, the same way são and estão do."}]},{"id":"cj-pres-irr-b","track":"verbs","group":"Presente","kicker":"Presente","title":"Irregular: ter, fazer, poder","blurb":"Have, do, and can. The eu form is the odd one.","note":"Ter: tenho, tem, temos, têm. Fazer: faço, faz, fazemos, fazem. Poder: posso, pode, podemos, podem. The circumflex on têm is the plural.","items":[{"id":"cj-pr-ter-eu","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · ter · eu","before":"Eu","after":"tempo.","answers":["tenho"],"reveal":"tenho","speak":"Eu tenho tempo.","explain":"Ter, eu: tenho. Age is also ter: eu tenho trinta anos, not eu sou trinta."},{"id":"cj-pr-ter-voce","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · ter · você","before":"Você","after":"a chave.","answers":["tem"],"reveal":"tem","speak":"Você tem a chave.","explain":"Você tem. No accent in the singular. Eles têm takes the circumflex."},{"id":"cj-pr-ter-nos","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · ter · nós","before":"Nós","after":"um carro.","answers":["temos"],"reveal":"temos","speak":"Nós temos um carro.","explain":"Nós temos."},{"id":"cj-pr-ter-eles","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · ter · eles","before":"Eles","after":"fome.","answers":["têm"],"reveal":"têm","speak":"Eles têm fome.","explain":"Eles têm. The circumflex is the only difference from ele tem. Hungry is ter fome, or estar com fome."},{"id":"cj-pr-fazer-eu","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · fazer · eu","before":"Eu","after":"o café.","answers":["faço"],"reveal":"faço","speak":"Eu faço o café.","explain":"Fazer, eu: faço, with a cedilla. The rest looks regular: faz, fazemos, fazem."},{"id":"cj-pr-fazer-voce","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · fazer · você","before":"Você","after":"a lição.","answers":["faz"],"reveal":"faz","speak":"Você faz a lição.","explain":"Você faz. Ele faz."},{"id":"cj-pr-fazer-nos","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · fazer · nós","before":"Nós","after":"o almoço.","answers":["fazemos"],"reveal":"fazemos","speak":"Nós fazemos o almoço.","explain":"Nós fazemos."},{"id":"cj-pr-fazer-eles","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · fazer · eles","before":"Eles","after":"barulho.","answers":["fazem"],"reveal":"fazem","speak":"Eles fazem barulho.","explain":"Eles fazem."},{"id":"cj-pr-poder-eu","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · poder · eu","before":"Eu","after":"entrar.","answers":["posso"],"reveal":"posso","speak":"Eu posso entrar.","explain":"Poder, eu: posso. The stem vowel changes. Posso entrar? is the natural request."},{"id":"cj-pr-poder-voce","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · poder · você","before":"Você","after":"esperar.","answers":["pode"],"reveal":"pode","speak":"Você pode esperar.","explain":"Você pode. Ele pode."},{"id":"cj-pr-poder-nos","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · poder · nós","before":"Nós","after":"sair.","answers":["podemos"],"reveal":"podemos","speak":"Nós podemos sair.","explain":"Nós podemos."},{"id":"cj-pr-poder-eles","kind":"fill","model":true,"tag":"Irregular","prompt":"Presente · poder · eles","before":"Eles","after":"vir.","answers":["podem"],"reveal":"podem","speak":"Eles podem vir.","explain":"Eles podem. Vir here is the infinitive to come, not a conjugated form."}]},{"id":"cj-perf-reg","track":"verbs","group":"Passado","kicker":"Pretérito","title":"Pretérito regular","blurb":"A finished event. Yesterday, once, and it is over.","note":"Chegar: cheguei, chegou, chegamos, chegaram. Vender: vendi, vendeu, vendemos, venderam. Partir: parti, partiu, partimos, partiram. For these three, the nós form matches the present. Ontem is what makes it past.","items":[{"id":"cj-pf-chegar-eu","kind":"fill","model":true,"tag":"Regular","prompt":"Pretérito · chegar · eu","before":"Eu","after":"cedo ontem.","answers":["cheguei"],"reveal":"cheguei","speak":"Eu cheguei cedo ontem.","explain":"Simple past of chegar, eu: cheguei. A completed event, pinned to yesterday."},{"id":"cj-pf-chegar-voce","kind":"fill","model":true,"tag":"Regular","prompt":"Pretérito · chegar · você","before":"Você","after":"tarde.","answers":["chegou"],"reveal":"chegou","speak":"Você chegou tarde.","explain":"Você chegou. Ele chegou, ela chegou."},{"id":"cj-pf-chegar-nos","kind":"fill","model":true,"tag":"Regular","prompt":"Pretérito · chegar · nós","before":"Nós","after":"ontem.","answers":["chegamos"],"reveal":"chegamos","speak":"Nós chegamos ontem.","explain":"Nós chegamos is spelled the same in the present and in this past. Ontem decides. A gente chegou, singular."},{"id":"cj-pf-chegar-eles","kind":"fill","model":true,"tag":"Regular","prompt":"Pretérito · chegar · eles","before":"Eles","after":"juntos.","answers":["chegaram"],"reveal":"chegaram","speak":"Eles chegaram juntos.","explain":"Eles chegaram. The -ram ending is the plural past."},{"id":"cj-pf-vender-eu","kind":"fill","model":true,"tag":"Regular","prompt":"Pretérito · vender · eu","before":"Eu","after":"o carro.","answers":["vendi"],"reveal":"vendi","speak":"Eu vendi o carro.","explain":"Vender, eu: vendi. Regular -er past: vendi, vendeu, vendemos, venderam."},{"id":"cj-pf-vender-voce","kind":"fill","model":true,"tag":"Regular","prompt":"Pretérito · vender · você","before":"Você","after":"a bicicleta.","answers":["vendeu"],"reveal":"vendeu","speak":"Você vendeu a bicicleta.","explain":"Você vendeu. The -er past for você, ele, and ela is -eu."},{"id":"cj-pf-vender-nos","kind":"fill","model":true,"tag":"Regular","prompt":"Pretérito · vender · nós","before":"Nós","after":"tudo.","answers":["vendemos"],"reveal":"vendemos","speak":"Nós vendemos tudo.","explain":"Nós vendemos matches the present spelling. The finished sale is what makes it past."},{"id":"cj-pf-vender-eles","kind":"fill","model":true,"tag":"Regular","prompt":"Pretérito · vender · eles","before":"Eles","after":"a loja.","answers":["venderam"],"reveal":"venderam","speak":"Eles venderam a loja.","explain":"Eles venderam."},{"id":"cj-pf-partir-eu","kind":"fill","model":true,"tag":"Regular","prompt":"Pretérito · partir · eu","before":"Eu","after":"de manhã.","answers":["parti"],"reveal":"parti","speak":"Eu parti de manhã.","explain":"Partir, eu: parti. Regular -ir past: parti, partiu, partimos, partiram."},{"id":"cj-pf-partir-voce","kind":"fill","model":true,"tag":"Regular","prompt":"Pretérito · partir · você","before":"Você","after":"ontem.","answers":["partiu"],"reveal":"partiu","speak":"Você partiu ontem.","explain":"Você partiu. The -ir past for você is -iu, not -eu."},{"id":"cj-pf-partir-nos","kind":"fill","model":true,"tag":"Regular","prompt":"Pretérito · partir · nós","before":"Nós","after":"cedo.","answers":["partimos"],"reveal":"partimos","speak":"Nós partimos cedo.","explain":"Nós partimos matches the present. The time word does the work."},{"id":"cj-pf-partir-eles","kind":"fill","model":true,"tag":"Regular","prompt":"Pretérito · partir · eles","before":"Eles","after":"à noite.","answers":["partiram"],"reveal":"partiram","speak":"Eles partiram à noite.","explain":"Eles partiram."}]},{"id":"cj-perf-irr","track":"verbs","group":"Passado","kicker":"Pretérito","title":"Pretérito irregular","blurb":"Ir and ser share one past. Ter and fazer do not.","note":"Ir and ser: fui, foi, fomos, foram. Meaning comes from the rest of the sentence: fui ao mercado is went, fui sincero is was. Ter: tive, teve, tivemos, tiveram. Fazer: fiz, fez, fizemos, fizeram. Estar: estive, esteve, estivemos, estiveram.","items":[{"id":"cj-pf-ir-eu","kind":"fill","model":true,"tag":"Irregular","prompt":"Pretérito · ir · eu","before":"Eu","after":"ao mercado.","answers":["fui"],"reveal":"fui","speak":"Eu fui ao mercado.","explain":"Ir, eu: fui. Fui, foi, fomos, foram. Ser uses the exact same forms."},{"id":"cj-pf-ir-voce","kind":"fill","model":true,"tag":"Irregular","prompt":"Pretérito · ir · você","before":"Você","after":"ao banco.","answers":["foi"],"reveal":"foi","speak":"Você foi ao banco.","explain":"Você foi. A place after foi means went."},{"id":"cj-pf-ir-nos","kind":"fill","model":true,"tag":"Irregular","prompt":"Pretérito · ir · nós","before":"Nós","after":"ao cinema.","answers":["fomos"],"reveal":"fomos","speak":"Nós fomos ao cinema.","explain":"Nós fomos. A gente foi, singular."},{"id":"cj-pf-ir-eles","kind":"fill","model":true,"tag":"Irregular","prompt":"Pretérito · ir · eles","before":"Eles","after":"para casa.","answers":["foram"],"reveal":"foram","speak":"Eles foram para casa.","explain":"Eles foram. Para casa means home."},{"id":"cj-pf-ser-eu","kind":"fill","model":true,"tag":"Irregular","prompt":"Pretérito · ser · eu","before":"Eu","after":"sincero.","answers":["fui"],"reveal":"fui","speak":"Eu fui sincero.","explain":"Ser, eu, is also fui. An adjective after it means was, not went. Eu fui sincero, eu fui ao mercado."},{"id":"cj-pf-ser-voce","kind":"fill","model":true,"tag":"Irregular","prompt":"Pretérito · ser · você","before":"Você","after":"gentil.","answers":["foi"],"reveal":"foi","speak":"Você foi gentil.","explain":"Você foi gentil means you were kind. Você foi ao banco means you went to the bank. Same verb form."},{"id":"cj-pf-ter-eu","kind":"fill","model":true,"tag":"Irregular","prompt":"Pretérito · ter · eu","before":"Eu","after":"um problema.","answers":["tive"],"reveal":"tive","speak":"Eu tive um problema.","explain":"Ter, eu: tive. Tive, teve, tivemos, tiveram."},{"id":"cj-pf-ter-voce","kind":"fill","model":true,"tag":"Irregular","prompt":"Pretérito · ter · você","before":"Você","after":"sorte.","answers":["teve"],"reveal":"teve","speak":"Você teve sorte.","explain":"Você teve. Ele teve."},{"id":"cj-pf-ter-nos","kind":"fill","model":true,"tag":"Irregular","prompt":"Pretérito · ter · nós","before":"Nós","after":"tempo.","answers":["tivemos"],"reveal":"tivemos","speak":"Nós tivemos tempo.","explain":"Nós tivemos. Unlike the regular verbs, this does not match the present temos."},{"id":"cj-pf-ter-eles","kind":"fill","model":true,"tag":"Irregular","prompt":"Pretérito · ter · eles","before":"Eles","after":"razão.","answers":["tiveram"],"reveal":"tiveram","speak":"Eles tiveram razão.","explain":"Eles tiveram. Ter razão means to be right."},{"id":"cj-pf-fazer-eu","kind":"fill","model":true,"tag":"Irregular","prompt":"Pretérito · fazer · eu","before":"Eu","after":"o jantar.","answers":["fiz"],"reveal":"fiz","speak":"Eu fiz o jantar.","explain":"Fazer, eu: fiz. Fiz, fez, fizemos, fizeram. The z stays."},{"id":"cj-pf-fazer-voce","kind":"fill","model":true,"tag":"Irregular","prompt":"Pretérito · fazer · você","before":"Você","after":"a mala.","answers":["fez"],"reveal":"fez","speak":"Você fez a mala.","explain":"Você fez. Fazer a mala means to pack."},{"id":"cj-pf-fazer-nos","kind":"fill","model":true,"tag":"Irregular","prompt":"Pretérito · fazer · nós","before":"Nós","after":"a lição.","answers":["fizemos"],"reveal":"fizemos","speak":"Nós fizemos a lição.","explain":"Nós fizemos. Not fazemos, which is present."},{"id":"cj-pf-fazer-eles","kind":"fill","model":true,"tag":"Irregular","prompt":"Pretérito · fazer · eles","before":"Eles","after":"silêncio.","answers":["fizeram"],"reveal":"fizeram","speak":"Eles fizeram silêncio.","explain":"Eles fizeram."},{"id":"cj-pf-estar-eu","kind":"fill","model":true,"tag":"Irregular","prompt":"Pretérito · estar · eu","before":"Eu","after":"no Rio.","answers":["estive"],"reveal":"estive","speak":"Eu estive no Rio.","explain":"Estar, eu: estive. Estive, esteve, estivemos, estiveram. Eu estive no Rio is a finished stay. Eu estava no Rio is the middle of a story."},{"id":"cj-pf-estar-voce","kind":"fill","model":true,"tag":"Irregular","prompt":"Pretérito · estar · você","before":"Você","after":"em casa.","answers":["esteve"],"reveal":"esteve","speak":"Você esteve em casa.","explain":"Você esteve. This past says the being-there is over."}]},{"id":"cj-imp-reg","track":"verbs","group":"Passado","kicker":"Imperfeito","title":"Imperfeito regular","blurb":"Used to, or the background of a story.","note":"Morar: morava, morava, morávamos, moravam. Aprender: aprendia, aprendia, aprendíamos, aprendiam. Assistir: assistia, assistia, assistíamos, assistiam. Eu and você are the same word. The accent sits on the nós form.","items":[{"id":"cj-im-morar-eu","kind":"fill","model":true,"tag":"Regular","prompt":"Imperfeito · morar · eu","before":"Eu","after":"no Rio.","answers":["morava"],"reveal":"morava","speak":"Eu morava no Rio.","explain":"Imperfect of morar: morava. Habit in the past, or what was going on. Eu and você are both morava."},{"id":"cj-im-morar-voce","kind":"fill","model":true,"tag":"Regular","prompt":"Imperfeito · morar · você","before":"Você","after":"aqui.","answers":["morava"],"reveal":"morava","speak":"Você morava aqui.","explain":"Você morava. Same form as eu."},{"id":"cj-im-morar-nos","kind":"fill","model":true,"tag":"Regular","prompt":"Imperfeito · morar · nós","before":"Nós","after":"perto.","answers":["morávamos"],"reveal":"morávamos","speak":"Nós morávamos perto.","explain":"Nós morávamos. The accent marks the nós form. A gente morava, singular."},{"id":"cj-im-morar-eles","kind":"fill","model":true,"tag":"Regular","prompt":"Imperfeito · morar · eles","before":"Eles","after":"longe.","answers":["moravam"],"reveal":"moravam","speak":"Eles moravam longe.","explain":"Eles moravam. No accent."},{"id":"cj-im-aprender-eu","kind":"fill","model":true,"tag":"Regular","prompt":"Imperfeito · aprender · eu","before":"Eu","after":"português.","answers":["aprendia"],"reveal":"aprendia","speak":"Eu aprendia português.","explain":"Regular -er imperfect: aprendia. Eu and você share it."},{"id":"cj-im-aprender-voce","kind":"fill","model":true,"tag":"Regular","prompt":"Imperfeito · aprender · você","before":"Você","after":"devagar.","answers":["aprendia"],"reveal":"aprendia","speak":"Você aprendia devagar.","explain":"Você aprendia. The pattern is aprendia, aprendia, aprendíamos, aprendiam."},{"id":"cj-im-aprender-nos","kind":"fill","model":true,"tag":"Regular","prompt":"Imperfeito · aprender · nós","before":"Nós","after":"juntos.","answers":["aprendíamos"],"reveal":"aprendíamos","speak":"Nós aprendíamos juntos.","explain":"Nós aprendíamos. Accent on the i."},{"id":"cj-im-aprender-eles","kind":"fill","model":true,"tag":"Regular","prompt":"Imperfeito · aprender · eles","before":"Eles","after":"rápido.","answers":["aprendiam"],"reveal":"aprendiam","speak":"Eles aprendiam rápido.","explain":"Eles aprendiam."},{"id":"cj-im-assistir-eu","kind":"fill","model":true,"tag":"Regular","prompt":"Imperfeito · assistir · eu","before":"Eu","after":"ao jogo.","answers":["assistia"],"reveal":"assistia","speak":"Eu assistia ao jogo.","explain":"Regular -ir imperfect: assistia. Assistir a means to watch."},{"id":"cj-im-assistir-voce","kind":"fill","model":true,"tag":"Regular","prompt":"Imperfeito · assistir · você","before":"Você","after":"ao filme.","answers":["assistia"],"reveal":"assistia","speak":"Você assistia ao filme.","explain":"Você assistia. Eu and você match."},{"id":"cj-im-assistir-nos","kind":"fill","model":true,"tag":"Regular","prompt":"Imperfeito · assistir · nós","before":"Nós","after":"juntos.","answers":["assistíamos"],"reveal":"assistíamos","speak":"Nós assistíamos juntos.","explain":"Nós assistíamos. Accent on the i."},{"id":"cj-im-assistir-eles","kind":"fill","model":true,"tag":"Regular","prompt":"Imperfeito · assistir · eles","before":"Eles","after":"televisão.","answers":["assistiam"],"reveal":"assistiam","speak":"Eles assistiam televisão.","explain":"Eles assistiam. This is background or habit, not one finished viewing."}]},{"id":"cj-imp-irr","track":"verbs","group":"Passado","kicker":"Imperfeito","title":"Imperfeito irregular","blurb":"Only four verbs break the pattern: ser, ter, vir, pôr.","note":"Ser: era, era, éramos, eram. Ter: tinha, tinha, tínhamos, tinham. Vir: vinha, vinha, vínhamos, vinham. Pôr: punha, punha, púnhamos, punham. Everything else, including ir (ia, íamos), is regular in this tense.","items":[{"id":"cj-im-ser-eu","kind":"fill","model":true,"tag":"Irregular","prompt":"Imperfeito · ser · eu","before":"Eu","after":"criança.","answers":["era"],"reveal":"era","speak":"Eu era criança.","explain":"Ser in the imperfect: era. Not fui, which is one finished state. Eu era criança means I used to be a child, over a stretch of time."},{"id":"cj-im-ser-voce","kind":"fill","model":true,"tag":"Irregular","prompt":"Imperfeito · ser · você","before":"Você","after":"gentil.","answers":["era"],"reveal":"era","speak":"Você era gentil.","explain":"Você era. Same form as eu era."},{"id":"cj-im-ser-nos","kind":"fill","model":true,"tag":"Irregular","prompt":"Imperfeito · ser · nós","before":"Nós","after":"amigos.","answers":["éramos"],"reveal":"éramos","speak":"Nós éramos amigos.","explain":"Nós éramos. The accent is on the first e."},{"id":"cj-im-ser-eles","kind":"fill","model":true,"tag":"Irregular","prompt":"Imperfeito · ser · eles","before":"Eles","after":"colegas.","answers":["eram"],"reveal":"eram","speak":"Eles eram colegas.","explain":"Eles eram. No accent."},{"id":"cj-im-ter-eu","kind":"fill","model":true,"tag":"Irregular","prompt":"Imperfeito · ter · eu","before":"Eu","after":"um cachorro.","answers":["tinha"],"reveal":"tinha","speak":"Eu tinha um cachorro.","explain":"Ter in the imperfect: tinha. Eu tinha um cachorro is what I used to have. Eu tive um cachorro can mean I had one, as a completed fact."},{"id":"cj-im-ter-voce","kind":"fill","model":true,"tag":"Irregular","prompt":"Imperfeito · ter · você","before":"Você","after":"tempo.","answers":["tinha"],"reveal":"tinha","speak":"Você tinha tempo.","explain":"Você tinha. Same as eu tinha."},{"id":"cj-im-ter-nos","kind":"fill","model":true,"tag":"Irregular","prompt":"Imperfeito · ter · nós","before":"Nós","after":"um carro.","answers":["tínhamos"],"reveal":"tínhamos","speak":"Nós tínhamos um carro.","explain":"Nós tínhamos. Accent on the i."},{"id":"cj-im-ter-eles","kind":"fill","model":true,"tag":"Irregular","prompt":"Imperfeito · ter · eles","before":"Eles","after":"razão.","answers":["tinham"],"reveal":"tinham","speak":"Eles tinham razão.","explain":"Eles tinham. They were in the right, as an ongoing situation."},{"id":"cj-im-vir-eu","kind":"fill","model":true,"tag":"Irregular","prompt":"Imperfeito · vir · eu","before":"Eu","after":"de ônibus.","answers":["vinha"],"reveal":"vinha","speak":"Eu vinha de ônibus.","explain":"Vir in the imperfect: vinha. I used to come, or I was coming. The simple past is vim, veio, viemos, vieram."},{"id":"cj-im-vir-voce","kind":"fill","model":true,"tag":"Irregular","prompt":"Imperfeito · vir · você","before":"Você","after":"cedo.","answers":["vinha"],"reveal":"vinha","speak":"Você vinha cedo.","explain":"Você vinha. Same form as eu vinha."},{"id":"cj-im-vir-nos","kind":"fill","model":true,"tag":"Irregular","prompt":"Imperfeito · vir · nós","before":"Nós","after":"juntos.","answers":["vínhamos"],"reveal":"vínhamos","speak":"Nós vínhamos juntos.","explain":"Nós vínhamos. Accent on the first i."},{"id":"cj-im-vir-eles","kind":"fill","model":true,"tag":"Irregular","prompt":"Imperfeito · vir · eles","before":"Eles","after":"de carro.","answers":["vinham"],"reveal":"vinham","speak":"Eles vinham de carro.","explain":"Eles vinham."},{"id":"cj-im-por-eu","kind":"fill","model":true,"tag":"Irregular","prompt":"Imperfeito · pôr · eu","before":"Eu","after":"a mesa.","answers":["punha"],"reveal":"punha","speak":"Eu punha a mesa.","explain":"Pôr in the imperfect: punha. Pôr a mesa means to set the table. Eu and você are both punha."},{"id":"cj-im-por-nos","kind":"fill","model":true,"tag":"Irregular","prompt":"Imperfeito · pôr · nós","before":"Nós","after":"a mesa.","answers":["púnhamos"],"reveal":"púnhamos","speak":"Nós púnhamos a mesa.","explain":"Nós púnhamos. Accent on the u. Eles punham, with no accent. Ir in this tense is regular: eu ia, nós íamos."}]},{"id":"cj-fut-simp","track":"verbs","group":"Futuro","kicker":"Futuro","title":"Futuro simples","blurb":"A plan or a prediction. The ending is added to the whole infinitive.","note":"Estudar: estudarei, estudará, estudaremos, estudarão. Correr: correrei, correrá, correremos, correrão. Subir: subirei, subirá, subiremos, subirão. Você, ele, ela, and a gente share the form with -á. In conversation, vou estudar is more common. This drill is the simple future itself. Hear it uses this phone or computer’s Brazilian Portuguese voice, not a Portugal one.","items":[{"id":"cj-fs-estudar-e ular","prompt":"Futuro · correr · eles","before":"Eles","after":"amanhã.","answers":["correrão"],"reveal":"correrão","speak":"Eles correrão amanhã.","explain":"Eles correrão."},{"id":"cj-fs-subir-eu","kind":"fill","model":true,"tag":"Regular","prompt":"Futuro · subir · eu","before":"Eu","after":"a escada.","answers":["subirei"],"reveal":"subirei","speak":"Eu subirei a escada.","explain":"Subir, eu: subirei. Regular -ir future: subirei, subirá, subiremos, subirão."},{"id":"cj-fs-subir-voce","kind":"fill","model":true,"tag":"Regular","prompt":"Futuro · subir · você","before":"Você","after":"agora.","answers":["subirá"],"reveal":"subirá","speak":"Você subirá agora.","explain":"Você subirá. Same ending as estudará and correrá: -á."},{"id":"cj-fs-subir-nos","kind":"fill","model":true,"tag":"Regular","prompt":"Futuro · subir · nós","before":"Nós","after":"devagar.","answers":["subiremos"],"reveal":"subiremos","speak":"Nós subiremos devagar.","explain":"Nós subiremos."},{"id":"cj-fs-subir-eles","kind":"fill","model":true,"tag":"Regular","prompt":"Futuro · subir · eles","before":"Eles","after":"logo.","answers":["subirão"],"reveal":"subirão","speak":"Eles subirão logo.","explain":"Eles subirão."}]},{"id":"cj-fut-irr","track":"verbs","group":"Futuro","kicker":"Futuro","title":"Futuro irregular","blurb":"Fazer, trazer, and dizer keep a shorter stem in the simple future.","note":"Fazer: farei, fará, faremos, farão. Trazer: trarei, trará, traremos, trarão. Dizer: direi, dirá, diremos, dirão. Not fazerei, trazerei, or dizerei. Você, ele, ela, and a gente share the form with -á. Hear it uses this phone or computer’s Brazilian Portuguese voice, not a Portugal one.","items":[{"id":"cj-fi-fazer-eu","kind":"fill","model":true,"tag":"Irregular","prompt":"Futuro · fazer · eu","before":"Eu","after":"o jantar.","answers":["farei"],"reveal":"farei","speak":"Eu farei o jantar.","explain":"Fazer drops to far-: farei, fará, faremos, farão. Not fazerei."},{"id":"cj-fi-fazer-voce","kind":"fill
